  }
  function setMuted(v) { muted = !!v; Object.values(decks).forEach(d => d.setVol(d.gain * master())); emit(); }
  function refreshVolumes() { Object.values(decks).forEach(d => d.setVol(d.gain * master())); }
  function retry() { const d = active && decks[active]; if (d && (d.state === 'blocked' || d.state === 'idle') && mode !== 'off' && mode !== 'cut' && mode !== 'cut6') { d.play().then(ok => ok && ramp(d, levelOf(mode === 'video' ? 'speech' : mode), 1.2)); } }
  function stopAll() { Object.values(decks).forEach(d => { if (d.stop) d.stop(); d.gain = 0; d.setVol(0); d.pause(); d.show(false); }); active = null; emit(); }
  function status() {
    const d = active && decks[active];
    return { track: active, title: active ? TRACKS[active].title : null, mode, ducked, muted, level: d ? Math.round(d.gain * 100) : 0, state: d ? d.state : 'idle', error: d && d.error, kind: d && d.kind };
  }
  /* preview a track from its start point (settings panel) */
  function preview(key, secs = 8) {
    const d = deck(key); stopAll(); active = key; d.gain = 0; d.setVol(0); d.show(true);
    return d.play().then(ok => { if (ok) { ramp(d, levelOf('card'), .5); setTimeout(() => { if (active === key) stopDeck(d, 1); active = null; emit(); }, secs * 1000); } return ok; });
  }
  function position(key) { const d = decks[key]; if (!d) return null; if (d.kind === 'file') return d.el.currentTime; if (d.kind === 'yt') return d.slot.time(); return null; }

    const cfg = Settings.get().tracks[key] || {}; const src = (cfg.src || '').trim();

    if (ytId(src)) return Video.probe(ytId(src)).then(r => r);
    return MediaCache.url(src).then(u => new Promise(res => {
      const a = new Audio(); let done = false;
      const fin = (ok, why) => { if (done) return; done = true; res({ ok, why }); };
      a.preload = 'auto'; a.addEventListener('loadedmetadata', () => fin(true, '可播放 · ' + fmt(a.duration) + ' · 已载入内存'), { once: true });

})();

/* synthesized effects: projector clatter for the countdown, a burst of TV static */
const SFX = (() => {
  let ctx = null;
  const ensure = () => {
    try { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); } catch (e) { ctx = null; }
    return ctx;
  };
  const on = () => VIEW === 'stage' && Settings.get().sfx && !Music.muted;
  const vol = () => .55 * Settings.get().vol.master / 100;
  function projector(dur = 2.6) {
    if (!on() || !ensure()) return;
    const sr = ctx.sampleRate, n = Math.floor(sr * dur), buf = ctx.createBuffer(1, n, sr), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) {
      const t = i / sr, ph = (t * 24) % 1;
      const click = ph < .09 ? (Math.random() * 2 - 1) * Math.exp(-ph * 55) : 0;
      const gate = ((t * 24 + .5) % 1) < .05 ? (Math.random() * 2 - 1) * .35 : 0;
      d[i] = click * .55 + gate * .25 + Math.sin(TAU * 48 * t) * .06 + Math.sin(TAU * 96 * t) * .025 + (Math.random() * 2 - 1) * .018;
    }
    const s = ctx.createBufferSource(); s.buffer = buf;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1400; bp.Q.value = .6;
    const lo = ctx.createBiquadFilter(); lo.type = 'lowpass'; lo.frequency.value = 5200;
    const g = ctx.createGain(); const t0 = ctx.currentTime;
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol() * .8, t0 + .12); g.gain.setValueAtTime(vol() * .8, t0 + dur - .5); g.gain.linearRampToValueAtTime(0, t0 + dur);
    s.connect(bp); bp.connect(lo); lo.connect(g); g.connect(ctx.destination); s.start();
  }
  function staticBurst(dur = .55) {
    if (!on() || !ensure()) return;
    const sr = ctx.sampleRate, n = Math.floor(sr * dur), buf = ctx.createBuffer(1, n, sr), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1);
    const s = ctx.createBufferSource(); s.buffer = buf;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 900;
    const g = ctx.createGain(); const t0 = ctx.currentTime;
    g.gain.setValueAtTime(vol() * .28, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
    s.connect(hp); hp.connect(g); g.connect(ctx.destination); s.start();
  }
  return { ensure, projector, staticBurst };
})();

/* ═══ VIDEO — YouTube IFrame API (or local files) behind one interface; precise cues, loops, fallback cards ═══ */
const YTAPI = (() => {
  let state = 'idle', reason = '';
  const waiters = [];
  const flush = () => { while (waiters.length) waiters.shift()(state === 'ready'); };
  function load() {
    if (state !== 'idle') return;
    if (VIEW === 'preview') { state = 'failed'; reason = 'preview'; return flush(); }
    if (LITE) { state = 'failed'; reason = '手机上不嵌入视频：点卡片上的链接去 YouTube 看'; return flush(); }
    state = 'loading';
    window.onYouTubeIframeAPIReady = () => { state = 'ready'; flush(); };
    const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.async = true;
    s.onerror = () => { state = 'failed'; reason = '无法加载 YouTube 接口（网络或环境阻止）'; flush(); };
    document.head.append(s);
    setTimeout(() => { if (state === 'loading') { state = 'failed'; reason = 'YouTube 接口加载超时'; flush(); } }, 12000);
  }
  return {
    ready() { return new Promise(res => { if (state === 'ready' || state === 'failed') res(state === 'ready'); else { waiters.push(res); load(); } }); },
    get state() { return state; }, get reason() { return reason; }, load,
  };
})();

const YT_ERR = { 2: '视频 ID 无效', 5: '播放器 HTML5 错误', 100: '视频不存在或已设为私密', 101: '视频所有者禁止嵌入', 150: '视频所有者禁止嵌入', 153: '缺少来源信息（请用 http(s) 打开页面）' };

function makeSlot(name, host, opt = {}) {
  const el = h('div.vslot', { id: 'vs-' + name });
  const ytWrap = h('div.vs-yt'), hold = h('div'); ytWrap.append(hold);
  const vid = h('video.vs-file', { playsinline: true, preload: 'auto' });
  const fb = h('div.vs-fb');
  el.append(ytWrap, vid, fb); host.append(el);
  const s = { name, el, kind: null, id: null, player: null, error: null, want: null, vol: 100, muted: false, playing: false, onEnd: null, endAt: null, loop: null, pending: null, watch: null, bg: !!opt.bg };

  function ensurePlayer() {
    if (s.player) return Promise.resolve(s.player);

    s.creating = YTAPI.ready().then(ok => {
      if (!ok) throw new Error(YTAPI.reason || 'YouTube 不可用');

          width: '100%', height: '100%',
          playerVars: { autoplay: 0, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3, modestbranding: 1, playsinline: 1, rel: 0, cc_load_policy: 0, origin: location.origin, enablejsapi: 1 },

            onError: (e) => onErr(e.data),

  function onErr(code) {
    s.error = YT_ERR[code] || ('YouTube 错误 ' + code); s.playing = false; el.classList.remove('playing');
    showFallback(); settle(false); Video.emit();
  }
  function onState(st) {
    if (st === 1) {          /* PLAYING */

const Scenes = (() => {
  const root = $('#scenes');
  const defs = {}, els = {}, rects = {};
  let timers = [];

  /* every scene gets its (empty) section at boot; its contents are built the first time it is needed,

  const built = new Set();
  function build() {

  }

  }
  /* phones keep only the scenes around the current one; the rest are emptied and rebuilt if the show returns */
  function dispose(key) {
    if (!built.has(key)) return;
    const d = defs[key];
    try { d && d.leave && d.leave(els[key]); } catch (e) { console.error(e); }
    els[key].replaceChildren(); built.delete(key);
  }
  function warm(from = 0) {
    const order = SCENES.map((s, k) => [Math.abs(k - from) + (k < from ? .5 : 0), s.key]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
    const idle = window.requestIdleCallback ? (f) => requestIdleCallback(f, { timeout: 1500 }) : (f) => setTimeout(f, 120);
    const step = () => { const k = order.find(key => !built.has(key)); if (!k) return; ensure(k); idle(step); };
    idle(step);

    $$('[data-show]', el).forEach(n => { const st = showState(n.dataset.show, i); n.classList.toggle('on', st === 'on'); n.classList.toggle('gone', st === 'gone'); });
  }

  function rate() { return clamp(+Settings.get().rate || 3.5, 2, 7); }
  function run(sc, i, opt = {}) {
    clearTimers();
    ensure(sc.key);
    /* a scene that was display:none until now needs its styles resolved before its reveals change,
       or the reveal transitions would be skipped */
    void els[sc.key].offsetWidth;
    /* phones build only what comes next, and let go of what is two or more scenes away */
    if (LITE) {
      const at = SCENES.indexOf(sc), n = SCENES[at + 1];

      if (n && !built.has(n.key)) setTimeout(() => ensure(n.key), 400);

      },

      after(ms, fn) {

        timers.push(setTimeout(() => { try { fn(false); } catch (e) { console.error(e); } }, ms));

/* the chapter opener used by every chapter: [act card + roadmap] → chapter card → dock */
function opener(el, sc, o) {
  const g = {};
  if (o.act) {
    g.act = A('div', 960, 430, { cls: 'rv blur slow' }, actCard(o.act));
    g.road = A('div', 960, 800, { cls: 'rv up slow', d: .5 }, roadmap());
    el.append(g.act, g.road);
  }
  g.card = A('div', o.cardX ?? 960, o.cardY ?? 500, { cls: 'rv zoom slow' }, chapterCard(o.card));
  el.append(g.card);
  g.cc = $('.cc', g.card);
  g.dock = () => {
    const hgt = g.card.offsetHeight || 480, top = (o.cardY ?? 500) - hgt / 2;
    g.cc.style.setProperty('--dock-y', Math.round((o.dockTop ?? 58) - top) + 'px');
    g.cc.classList.add('docked');
  };
  /* run(ctx): plays the opener on beat 0; returns ms when the content may enter */
  g.run = (ctx, { dock = true } = {}) => {
    const actMs = o.act ? 2600 : 0;
    const dockMs = actMs + (o.hold ?? 2600);
    if (!ctx.fwd) {
      if (g.act) { vis(g.act, 'off'); vis(g.road, 'off'); }
      vis(g.card, 'on'); if (dock) g.dock(); else g.cc.classList.remove('docked');
      return 0;
    }
    g.cc.classList.remove('docked'); vis(g.card, 'off');
    if (g.act) {
      vis(g.act, 'on'); vis(g.road, 'on'); g.road.firstChild.focusOn(null, { instant: true });
      ctx.after(300, () => g.road.firstChild.focusOn(sc.key));
      ctx.after(actMs, () => { vis(g.act, 'gone'); vis(g.road, 'gone'); });
      ctx.after(actMs + 350, () => vis(g.card, 'on'));
    } else vis(g.card, 'on');
    if (dock) ctx.after(dockMs, () => g.dock());
    return dock ? dockMs + 300 : actMs + 600;
  };
  g.hide = () => { if (g.act) { vis(g.act, 'off'); vis(g.road, 'off'); } vis(g.card, 'gone'); };
  return g;
}

/* generative steel-mill skyline for Gary */
function millSVG() {
  const r = rng(1958); let s = '';
  let x = -20;
  const fill = '#1d1007';
  while (x < 1940) {
    const kind = r();
    if (kind < .22) {
      const w = 16 + r() * 14, hh = 150 + r() * 110;
      s += `<rect x="${x}" y="${270 - hh}" width="${w}" height="${hh}" fill="${fill}"/>`;
      s += `<rect x="${x - 2}" y="${270 - hh + 18}" width="${w + 4}" height="5" fill="#2a170a"/>`;
      s += `<g class="smoke" fill="#6b5240">${[0, 1, 2].map(k => `<circle cx="${x + w / 2}" cy="${270 - hh - 6}" r="${7 + r() * 6}" style="animation-delay:${-(r() * 9 + k * 3).toFixed(2)}s"/>`).join('')}</g>`;
      x += w + 6 + r() * 30;
    } else if (kind < .36) {
      const w = 70 + r() * 30, hh = 140 + r() * 60;
      s += `<path d="M${x} 270 L${x} ${270 - hh * .7} Q${x + w / 2} ${270 - hh - 10} ${x + w} ${270 - hh * .7} L${x + w} 270 Z" fill="${fill}"/>`;
      s += `<rect x="${x + w * .42}" y="${270 - hh - 40}" width="${w * .16}" height="50" fill="${fill}"/>`;
      x += w + 10;
    } else if (kind < .5) {
      const w = 140 + r() * 120;
      s += `<path d="M${x} 270 L${x + w} ${150 + r() * 40} L${x + w + 8} ${156 + r() * 40} L${x + 10} 270 Z" fill="${fill}" opacity=".8"/>`;
      x += 30;
    } else {
      const w = 60 + r() * 140, hh = 50 + r() * 90;
      s += `<rect x="${x}" y="${270 - hh}" width="${w}" height="${hh}" fill="${fill}"/>`;
      for (let wx = x + 8; wx < x + w - 10; wx += 16) for (let wy = 270 - hh + 12; wy < 255; wy += 22) if (r() < .35) s += `<rect x="${wx}" y="${wy}" width="7" height="9" fill="#ffb24a" opacity="${(.35 + r() * .5).toFixed(2)}"/>`;
      x += w + r() * 10;
    }
  }
  return `<svg viewBox="0 0 1920 270" preserveAspectRatio="none"><defs><linearGradient id="millSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a3c" stop-opacity="0"/><stop offset="1" stop-color="#ff8a30" stop-opacity=".35"/></linearGradient></defs><rect x="0" y="80" width="1920" height="190" fill="url(#millSky)"/>${s}<rect x="0" y="262" width="1920" height="8" fill="#130a04"/></svg>`;
}

function waveSVG() {

  for (let x = 0; x <= 1500; x += 2) {
    let y = 160;

}

/* the Billie Jean pavement, in miniature: tiles light up under his feet */
function bjMini() {
  const wrap = h('div.bj');
  const rows = 3, cols = 7, y0 = 268, y1 = 400, SW = 504;
  const edge = (r) => y0 + (y1 - y0) * Math.pow(r / rows, 1.1), wid = (r) => .66 + .34 * (r / rows);
  const xAt = (c, r) => SW / 2 + (c / cols - .5) * SW * 1.3 * wid(r);
  let tiles = '';
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) tiles += `<polygon data-c="${c}" data-r="${r}" points="${xAt(c, r) + 2},${edge(r) + 2} ${xAt(c + 1, r) - 2},${edge(r) + 2} ${xAt(c + 1, r + 1) - 2},${edge(r + 1) - 2} ${xAt(c, r + 1) + 2},${edge(r + 1) - 2}"/>`;
  wrap.append(svgEl(`<svg class="bj-floor" viewBox="0 0 504 400">${tiles}</svg>`), h('div.bj-cap', { text: 'BILLIE JEAN · 1983' }));
  const fig = new Figure.Fig({ costume: 'billie', pose: 'stand', glowPx: 3, rimPx: 1, rim: '#ffd0ec', glow: 'rgba(255, 120, 200, .35)', shadow: 'none' });
  const FX0 = 40, FY = 352, FH = 236;
  fig.place(FX0, FY, FH);
  wrap.append(fig.el);
  const polys = $$('polygon', wrap), lit = new Array(polys.length).fill(0);
  const midRow = 1, rowY = (edge(midRow) + edge(midRow + 1)) / 2;
  let off = null, alive = false;
  const step = () => {
    if (!alive) return;
    fig.pose('stand', { x: 0 });
    fig.walk({ steps: 9, stride: 50, stepMs: 540, done: () => setTimeout(step, 500) });
  };
  wrap.start = () => {
    if (alive) return; alive = true; step();
    off = Loop.add(() => {
      const J = fig.J; if (!J) return;
      for (const Lg of [J.nL, J.fL]) {
        if (Lg.A[1] < -40) continue;                                  /* foot in the air */
        const x = FX0 + Lg.A[0] * fig.scale;
        for (let c = 0; c < cols; c++) if (x >= xAt(c, midRow + .5) && x < xAt(c + 1, midRow + .5)) lit[midRow * cols + c] = now() + 420;
      }
      const t = now(); polys.forEach((p, k) => p.classList.toggle('lit', lit[k] > t));
    });
  };
  wrap.stop = () => { alive = false; fig.stop(); if (off) { off(); off = null; } polys.forEach(p => p.classList.remove('lit')); };
  wrap.fig = fig;
  return wrap;
}

/* ── 20-director ── */
/* ═══ DIRECTOR — the single state machine; light, music and video only obey it ═══ */
const Director = (() => {
  const stage = $('#stage'), black = $('#black'), flashEl = $('#flash');
  let beat = -1, token = 0, lastFlash = 0, blackout = false, reduced = false, enteredAt = 0, sceneEnteredAt = 0;
  let shown = null;                 /* the scene actually on stage — a cancelled blackout may not have swapped yet */
  const timers = [];
  const later = (ms, fn) => { const t = setTimeout(fn, ms); timers.push(t); return t; };
  const clearLater = () => { while (timers.length) clearTimeout(timers.pop()); };

  function skippable(b) {
    if (!b) return false;
    if (b.optional && !Video.configured(b.optional)) return true;
    if (b.cut && Settings.get().trim) return true;
    return false;
  }
  function step(from, dir) {
    let i = from + dir;
    while (i >= 0 && i < BEATS.length && skippable(BEATS[i])) i += dir;
    return i;
  }

  function setReduced() {
    const m = Settings.get().motion;
    reduced = m === 'reduce' || (m === 'auto' && window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
    stage.classList.toggle('reduced', reduced);
    Light.setReduced(reduced); FX.setReduced(reduced);
  }

  function setLang(lang, { rerun = true } = {}) {
    stage.dataset.lang = lang;
    document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : 'ko';
    if (rerun && beat >= 0) {
      const b = BEATS[beat], sc = SCENES[b.scene];
      stage.classList.add('instant');
      Scenes.run(sc, b.local, { dir: 0, instant: true });
      HUD.setAct(null); HUD.setAct(sc, { instant: true });
      requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.remove('instant')));
    }
  }

  function fadeBlack(to, ms) {
    black.getAnimations().forEach(a => a.cancel());
    const from = +getComputedStyle(black).opacity;
    black.style.opacity = to;
    if (to > 0 || from > 0) black.style.visibility = 'visible';
    const hide = () => { if (+black.style.opacity <= .001) black.style.visibility = 'hidden'; };
    if (ms > 0) black.animate([{ opacity: from }, { opacity: to }], { duration: ms, easing: 'ease-in-out' }).onfinish = hide;
    else hide();
  }

  function showScene(sc, mode, ms) {
    const el = Scenes.el(sc.key);
    $$('.scene', stage).forEach(s => {
      if (s === el) return;
      if (s.classList.contains('active') && mode === 'cross' && ms > 0) {
        s.classList.remove('active'); s.classList.add('leaving');
        s.getAnimations().forEach(a => a.cancel());
        const a = s.animate([{ opacity: 1 }, { opacity: 0 }], { duration: ms, easing: 'linear', fill: 'forwards' });
        a.onfinish = () => { s.classList.remove('leaving'); a.cancel(); };
      } else { s.classList.remove('active', 'leaving'); s.getAnimations().forEach(a => a.cancel()); }
    });
    el.getAnimations().forEach(a => a.cancel());
    el.classList.remove('leaving'); el.classList.add('active');
    shown = sc;
    if (ms > 0 && mode !== 'cut') el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: ms, easing: 'linear' });
  }

  function applyBeat(b, { dir = 1, instant = false, first = false, enterDur, sceneChange = false } = {}) {
    const sc = SCENES[b.scene];
    stage.classList.toggle('rev', dir < 0);
    if (instant) stage.classList.add('instant');
    HUD.visible(true);
    HUD.setAct(sc, { instant });
    HUD.setYear(b.year ?? sc.year, { instant, show: sc.hud });
    Scenes.run(sc, b.local, { dir, instant, first, enterDur });
    if (VIEW === 'stage') {
      Music.apply(sc.track, b.mus || 'speech', { dir, instant });
      Video.enterBeat(b, { dir, instant });
    }
    if (instant) { void stage.offsetWidth; requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.remove('instant'))); }
  }

  function standby(instant) {
    $$('.scene', stage).forEach(s => s.classList.remove('active', 'leaving'));
    shown = null;
    HUD.visible(false); HUD.setAct(null); HUD.setYear(null, { show: false }); HUD.hideNP();
    Era.apply('cold', { instant: true });
    Light.set({ ambient: 1, wash: 0, bloom: 0, haze: 0, dust: 0, lights: [] }, { instant: true });
    if (VIEW === 'stage') { Music.stopAll(); ['main', 'tv', 'pip'].forEach(n => Video.stop(n)); }
    document.body.classList.remove('started');
  }

  /* listeners told after every page turn (the frame monitor uses it) */
  const turned = new Set();
  function go(target, mode = 'jump') { goRaw(target, mode); turned.forEach(f => { try { f(beat, mode); } catch (e) { console.error(e); } }); }
  /* go to a beat. mode: next | prev | jump */
  function goRaw(target, mode = 'jump') {
    target = clamp(target, -1, BEATS.length - 1);
    const from = beat;
    if (target === from && mode !== 'jump') return;
    const my = ++token;
    clearLater(); Scenes.clearTimers();
    if (Video.cancelLeader) { Video.cancelLeader(); Video.cancelLeader = null; }
    if (+getComputedStyle(black).opacity > .01) fadeBlack(0, 260);   /* a cancelled blackout never leaves the stage dark */
    beat = target;
    if (VIEW === 'stage') { Session.beat = target; Session.save(); }
    if (target < 0) { standby(); fadeBlack(0, 0); publish(); return; }
    document.body.classList.add('started');
    const b = BEATS[target], sc = SCENES[b.scene];
    const prevSc = shown;
    const dir = mode === 'next' ? 1 : mode === 'prev' ? -1 : 0;

    if (VIEW === 'stage' && dir > 0) {
      if (Session.timer.start == null) { Session.startClock(); Runs.begin(); }
      Runs.mark(target, Session.elapsed());
    }

    const change = !prevSc || prevSc !== sc;
    enteredAt = Session.elapsed(); if (change) sceneEnteredAt = enteredAt;
    if (!change) { applyBeat(b, { dir, instant: dir === 0 }); if (dir === 0) jumpFade(); publish(); return; }

    if (prevSc) { Scenes.leave(prevSc); if (VIEW === 'stage') { Video.stop('tv'); Video.stop('pip'); } }

    if (dir === 0 || reduced) {                                    /* jump: direct state, 0.4s fade-in */
      Era.apply(sc.era, { instant: true });
      showScene(sc, 'cut', 0);
      applyBeat(b, { dir: 0, instant: true, first: true });
      jumpFade(); publish(); return;
    }
    if (dir < 0) {                                                 /* rewind: precise, quick */
      Era.apply(sc.era, { dur: .4 });
      showScene(sc, 'cross', 380);
      applyBeat(b, { dir: -1, first: true, enterDur: .4 });
      publish(); return;
    }
    const kind = sc.enter || 'dissolve';
    if (kind === 'blackout') {                                     /* between acts: 0.6 down · 0.4 hold · 0.8 up */
      fadeBlack(1, 600);
      if (VIEW === 'stage') Music.apply(null, 'off', { dir: 1 });
      later(1000, () => {
        if (my !== token) return;
        Era.apply(sc.era, { instant: true });
        showScene(sc, 'cut', 0);
        applyBeat(b, { dir: 1, first: true, enterDur: .8 });
        fadeBlack(0, 800);
        publish();
      });
      publish(); return;
    }
    const ms = kind === 'houselights' ? 1600 : 1800;               /* era dissolve */
    Era.apply(sc.era, { dur: ms / 1000 });
    showScene(sc, 'cross', ms);
    applyBeat(b, { dir: 1, first: true, enterDur: ms / 1000 });
    publish();
  }
  function jumpFade() { fadeBlack(1, 0); requestAnimationFrame(() => fadeBlack(0, 400)); }

  function next() {
    if (beat >= BEATS.length - 1) { finish(); return; }
    go(step(beat, 1), 'next');
  }
  function prev() { if (beat <= -1) return; go(step(beat, -1) < 0 ? -1 : step(beat, -1), 'prev'); }
  function finish() {
    if (VIEW !== 'stage') return;
    if (Session.running()) {
      const t = Session.elapsed(); Runs.finish(t); Session.pause();
      toast(`演讲结束 · 用时 <b>${fmt(t)}</b>（计划 ${fmt(TOTAL_PLAN)}）`, 6000);
      publish();
    }
  }
  function jumpScene(key) { const sc = SCENES.find(s => s.key === key); if (sc) go(sc.first, 'jump'); }

  function flash() {
    if (reduced) return;
    const t = now(); if (t - lastFlash < 1500) return; lastFlash = t;
    flashEl.style.visibility = 'visible';
    flashEl.animate([{ opacity: 0 }, { opacity: .35, offset: .23 }, { opacity: 0 }], { duration: 520, easing: 'ease-out' }).onfinish = () => { flashEl.style.visibility = ''; };
  }
  function toggleBlack(v) { blackout = v == null ? !blackout : !!v; $('#bkey').classList.toggle('on', blackout); publish(); }

  /* state for the presenter window */
  function snapshot() {
    return { type: 'state', view: VIEW, sid: App.SID, beat, total: BEATS.length, lang: stage.dataset.lang, blackout, muted: Music.muted, timer: Session.timer, enteredAt, sceneEnteredAt, sceneTimes: Runs.sceneTimes(Runs.cur()), music: Music.status(), video: Video.status(), trim: Settings.get().trim, run: Runs.curId, at: Date.now() };
  }
  let pubTimer = 0;
  function publish() { if (VIEW !== 'stage') return; clearTimeout(pubTimer); pubTimer = setTimeout(() => Bus.send(snapshot()), 0); }

  return {
    go, onTurn(f) { turned.add(f); return () => turned.delete(f); },
    next, prev, finish, jumpScene, flash, toggleBlack, setLang, setReduced, publish, snapshot, skippable, step,
    get beat() { return beat; }, get reduced() { return reduced; }, get blackout() { return blackout; },
  };
})();

/* ═══ PERF — watches the frames after each page turn; if the show keeps stuttering, the quality drops a tier ═══
   Two slow page turns in a row (median frame > 26 ms, or one frame in ten > 60 ms) are needed, so a single hiccup
   (a font arriving, a video starting) never changes anything. The choice is remembered for this device. */
const Perf = (() => {
  let strikes = 0, run = 0, last = null;
  function watch() {
    if (!Q.auto() || document.hidden || Director.reduced) return;
    const my = ++run, t0 = now(); let prev = 0; const d = [];
    const f = (t) => {
      if (my !== run || document.hidden) return;
      if (prev) d.push(t - prev); prev = t;
      if (t - t0 < 2600) requestAnimationFrame(f); else judge(d);
    };
    requestAnimationFrame(f);
  }
  function judge(d) {
    if (d.length < 4) return;
    const s = d.slice().sort((a, b) => a - b), med = s[s.length >> 1], p90 = s[Math.floor(s.length * .9)];
    last = { fps: Math.round(1000 / med), med: Math.round(med), p90: Math.round(p90), tier: Q.tier, at: Date.now() };
    strikes = (med > 26 || p90 > 60) ? strikes + 1 : Math.max(0, strikes - 1);
    /* silent on the projector: the note goes only to the presenter window (and the settings panel shows it) */
    if (strikes >= 2 && Q.step(last.fps)) { strikes = 0; Director.publish(); if (Date.now() - (window.__pvSeen || 0) < 3500) toast(`画面有些卡：已自动切换到「${Q.name}」画质（设置 → 演讲 → 画质 可以改回）`, 6000); }
  }
  return { watch, get last() { return last; } };
})();

    const p = el.requestFullscreen ? el.requestFullscreen() : (el.webkitRequestFullscreen && el.webkitRequestFullscreen());
    if (p && p.catch) p.catch(() => toast('这个环境不允许全屏：请用浏览器自己的全屏（F11 / ⌃⌘F）', 4000, { local: true }));
  }
  function openPresenter() {
    const url = location.pathname + location.search + '#presenter';
    let w = null; try { w = window.open(url, 'bts-presenter', 'popup,width=1440,height=900'); } catch (e) { w = null; }
    if (!w) toast(`浏览器拦截了新窗口：<a href="${url}" target="_blank" rel="noopener">点这里打开演讲者视图</a>`, 9000, { local: true });
  }
  function cycleLang() {
    const order = ['ko', 'zh', 'bi'];
    const cur = stage.dataset.lang || Settings.get().lang;
    Settings.set('lang', order[(order.indexOf(cur) + 1) % 3]);
  }

  /* commands run in the stage window (the presenter forwards them) */
  function exec(cmd, m = {}) {
    SFX.ensure(); if (Music.pendingGesture) { Music.pendingGesture = false; Music.retry(); }
    switch (cmd) {
      case 'next': if (Overview.open) Overview.close(); Director.next(); break;
      case 'prev': if (Overview.open) Overview.close(); Director.prev(); break;
      case 'go': Director.go(m.beat, 'jump'); break;
      case 'black': Director.toggleBlack(); break;
      case 'mute': { const v = !Music.muted; Music.setMuted(v); Video.muteAll(v); toast(v ? '已静音' : '取消静音', 1200); break; }
      case 'lang': cycleLang(); break;
      case 'cue': Video.cue(m.n); break;
      case 'toggle': Video.toggle(); break;
      case 'seek': Video.seekBy(m.d || 5); break;
      case 'capture': Video.captureCue(); break;
      case 'overview': Overview.toggle(); break;
      case 'angle': { const b = BEATS[Director.beat]; if (b) Scenes.key(SCENES[b.scene].key, m.up ? 'ArrowUp' : 'ArrowDown'); break; }
      case 'pause': Session.pause(); break;
      case 'resume': Session.resume(); break;
      case 'clock-reset': Session.resetClock(); Runs.curId = null; Runs.save(); break;
      case 'reset': Session.resetClock(); Runs.curId = null; Runs.save(); Director.go(-1); break;
    }
    Director.publish();
  }
  function cmd(c, m = {}) {
    if (VIEW === 'presenter') { if (c === 'angle' || c === 'capture' || c === 'cue' || c === 'toggle' || c === 'seek') Presenter.send(c, m); else Presenter.send(c, m); }
    else exec(c, m);
  }

  function onKey(e) {
    if (Demo.on && !['Shift', 'Control', 'Alt', 'Meta'].includes(e.key)) { Demo.stop(); e.preventDefault(); return; }
    if (e.key === 'F5' || (e.key === 'r' && (e.ctrlKey || e.metaKey) && document.body.classList.contains('started'))) { e.preventDefault(); toast('已屏蔽刷新（F5），防止翻页器误触', 1600); return; }
    const t = e.target;
    if (t && t.closest && t.closest('input, textarea, select, [contenteditable]')) { if (e.key === 'Escape') t.blur(); return; }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (VIEW === 'stage') Wake.req();
    const k = e.key;
    const beat = BEATS[VIEW === 'presenter' ? (Presenter.beat ?? -1) : Director.beat];
    if ((k === 'ArrowUp' || k === 'ArrowDown') && beat && beat.keys === 'angle') { e.preventDefault(); cmd('angle', { up: k === 'ArrowUp' }); return; }
    if (e.shiftKey && (k === 'ArrowLeft' || k === 'ArrowRight')) { e.preventDefault(); cmd('seek', { d: k === 'ArrowLeft' ? -5 : 5 }); return; }
    let handled = true;
    switch (k) {
      case 'ArrowRight': case 'ArrowDown': case 'PageDown': case ' ': case 'Spacebar': cmd('next'); break;
      case 'ArrowLeft': case 'ArrowUp': case 'PageUp': cmd('prev'); break;
      case 'b': case 'B': case '.': cmd('black'); break;
      case '1': case '2': case '3': case '4': cmd('cue', { n: +k }); break;
      case 'k': case 'K': cmd('toggle'); break;
      case 'c': case 'C': cmd('capture'); break;
      case 'g': case 'G': cmd('overview'); break;
      case 't': case 'T': if (VIEW === 'stage') { const v = Torch.toggle(); toast(v ? '手电筒：开（移动鼠标照亮暗处）' : '手电筒：关', 1600, { local: true }); } break;
      case 'm': case 'M': cmd('mute'); break;
      case 'l': case 'L': cmd('lang'); break;
      case 'f': case 'F': fullscreen(); break;
      case 'p': case 'P': if (VIEW === 'stage') openPresenter(); break;
      case 's': case 'S': Panel.toggle(); break;
      case '?': Panel.open('keys'); break;
      case 'Escape': if (Panel.isOpen()) Panel.close(); else if (VIEW === 'stage' && Overview.open) Overview.close(); else handled = false; break;
      default: handled = false;
    }
    if (handled) e.preventDefault();
  }

  function idle() {
    let t = 0;
    const wake = () => { vp.classList.remove('idle'); clearTimeout(t); t = setTimeout(() => vp.classList.add('idle'), 2000); };
    ['mousemove', 'mousedown', 'touchstart'].forEach(ev => window.addEventListener(ev, wake, { passive: true }));
    wake();
  }

  function hint() {
    const el = $('#hint');
    const touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
    const k = (key, t) => `<span class="hk"><kbd>${key}</kbd> ${t}</span>`;
    el.innerHTML = (touch
      ? '<span class="hk">点右侧 · 下一页</span><span class="hk">点左侧 · 上一页</span><span class="hk">横屏观看更好</span>'
      : k('→', '开始') + k('P', '演讲者视图') + k('S', '设置与课前预检') + k('F', '全屏') + k('G', '总览') + k('L', '语言') +
        '<br><span class="hk">鼠标可以探索：移动是手电筒，人物、卡片、旋钮可以点或拖（<kbd>T</kbd> 关掉手电筒）</span>' +
        (window.self !== window.top ? '<br><span class="hk">先点一下画面，让键盘生效</span>' : '')) +
      '<br><button type="button" class="hint-demo">▶ 自动演示整场</button>';
    $('.hint-demo', el).addEventListener('click', (e) => { e.stopPropagation(); SFX.ensure(); Demo.start(); });
  }
  /* touch: tap the right side for next, the left third for previous (mouse clicks never advance) */
  function touchNav() {
    let sx = 0, sy = 0, st = 0;
    vp.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'touch') return; sx = e.clientX; sy = e.clientY; st = now(); }, { passive: true });
    vp.addEventListener('pointerup', (e) => {
      if (e.pointerType !== 'touch') return;
      if (Panel.isOpen() || Overview.open || e.target.closest(TOUCH ? 'a, button, .ov-card' : 'a, button, .ov-card, .int, .drag, .tilt')) return;
      if (Demo.on) { Demo.stop(); return; }
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (now() - st > 900 || Math.abs(dy) > 80) return;
      if (dx < -50) cmd('next'); else if (dx > 50) cmd('prev');
      else if (e.clientX > window.innerWidth * .34) cmd('next'); else cmd('prev');
    }, { passive: true });
  }

  function bootStage() {
    computePlan(Scenes.rate());
    stage.classList.toggle('touch', TOUCH); stage.classList.toggle('lite', LITE);
    Q.pick(); let qPref = Settings.get().quality || 'auto';
    Settings.on((s) => { const p = s.quality || 'auto'; if (p !== qPref) { qPref = p; if (p === 'auto') Q.forget(); Q.pick(); Director.publish(); } });
    Director.onTurn(() => Perf.watch());
    Scenes.build();
    Director.setReduced();
    Director.setLang(Settings.get().lang, { rerun: false });
    fit(); window.addEventListener('resize', fit);
    Session.load(); Runs.load();
    hint(); idle();
    document.addEventListener('keydown', onKey);
    vp.addEventListener('click', () => { if (Demo.on) Demo.stop(); SFX.ensure(); if (Music.pendingGesture) { Music.pendingGesture = false; Music.retry(); } });
    touchNav();
    document.addEventListener('fullscreenchange', () => document.body.classList.toggle('fs', !!document.fullscreenElement));
    if (/^#?demo$/.test(location.hash)) setTimeout(() => Demo.start(), 1800);
    if (window.matchMedia) matchMedia('(prefers-reduced-motion: reduce)').addEventListener?.('change', () => Director.setReduced());
    Settings.on((s) => {
      if (stage.dataset.lang !== s.lang) Director.setLang(s.lang);
      Director.setReduced(); computePlan(Scenes.rate()); Music.refreshVolumes(); Overview.rebuild(); Director.publish();
    });
    YTAPI.load();
    if (!LITE) setTimeout(() => MediaCache.warmAll(), 2500);
    Bus.on((m) => {
      if (!m) return;
      if (m.type === 'hello') { window.__pvSeen = Date.now(); Director.publish(); }
      else if (m.type === 'cmd') exec(m.cmd, m);
      else if (m.type === 'state' && m.sid && m.sid !== SID && !warnedTwin && m.view === 'stage') { warnedTwin = true; toast('检测到另一个舞台窗口也开着：请只保留一个，否则翻页会被执行两次', 8000); }
    });
    Music.on(() => Director.publish()); Video.on(() => Director.publish());
    setInterval(() => Director.publish(), 1000);
    if (Session.beat >= 0) {
      Director.go(Session.beat, 'jump');
      const b = BEATS[Session.beat];
      toast(`已回到刚才的节拍：${SCENES[b.scene].short.zh} ${b.tag}${Session.timer.start != null ? ' · 计时继续' : ''}<br><span style="opacity:.7">从头开始：设置 → 演讲 → 回到开场前</span>`, 6000);
    } else Director.go(-1);
    if (!LITE) Scenes.warm(Math.max(0, Director.beat >= 0 ? BEATS[Director.beat].scene : 0));
    else Scenes.ensure(SCENES[0].key);
    document.fonts && document.fonts.ready.then(() => { if (Director.beat >= 0) Director.setLang(stage.dataset.lang); });
  }

  function bootPreview() {
    document.body.classList.add('preview-mode');
    computePlan(Scenes.rate());
    Q.pick();
    Scenes.build();
    stage.classList.add('reduced');
    Light.setReduced(false); Light.setStill(true); FX.setReduced(true);
    Director.setLang(Settings.get().lang, { rerun: false });
    fit(); window.addEventListener('resize', fit);
    let last = null;
    Bus.on((m) => {
      if (!m || m.type !== 'state') return;
      if (m.lang && stage.dataset.lang !== m.lang) Director.setLang(m.lang, { rerun: false });
      let t = m.beat + 1; while (t < BEATS.length && Director.skippable(BEATS[t])) t++;
      if (t >= BEATS.length) t = BEATS.length - 1;
      if (t !== last) { last = t; Director.go(t, 'jump'); }
    });
    Bus.send({ type: 'hello', from: 'preview' });
  }

  function bootPresenter() {
    Session.load(); Runs.load();
    Presenter.mount();
    document.addEventListener('keydown', onKey);
  }

  return { boot() { if (VIEW === 'presenter') bootPresenter(); else if (VIEW === 'preview') bootPreview(); else bootStage(); }, cmd, exec, fullscreen, openPresenter, SID, fit };
})();

/* ── 99-boot ── */
/* ═══ go ═══ */
window.BTS = { BEATS, SCENES, Director, Settings, Session, Runs, Light, Video, Music, Scenes, Era, FX, HUD, Overview, Panel, Figure, h, Torch, Pointer, Loop };
App.boot();
})();
</script>
</body>
