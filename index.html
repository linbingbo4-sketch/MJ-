<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BEYOND THE SPOTLIGHT</title>
<meta name="description" content="Beyond the Spotlight — 스포트라이트 너머의 마이클 잭슨. 15분 한국어 발표를 위한 한 편의 무대.">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Barlow+Condensed:wght@300;400;500;600;700;800&family=Hahmlet:wght@300..800&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400..900&family=Noto+Sans+SC:wght@300..700&family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:opsz,wght,SOFT@9..144,300..900,0..100&family=Monoton&family=Limelight&family=Nanum+Pen+Script&family=Long+Cang&family=Permanent+Marker&display=swap">
<style>
/* ── 01-core ── */
/* Theatre: one 1920×1080 black stage, letterboxed and scaled to the projector.
   Everything audience-facing lives inside #stage; operator UI lives outside it in real pixels. */
:root {
  --e-stage: cubic-bezier(.16, 1, .3, 1);      /* fader push: fast, then settles */
  --e-spot: cubic-bezier(.65, 0, .35, 1);      /* a hand pushing the follow spot */
  --e-sine: cubic-bezier(.37, 0, .63, 1);
  --e-drop: cubic-bezier(.34, 1.56, .64, 1);
  --ink: #f5ecdc;
  --acc: #ffd08a;
  --acc2: #ffe9c4;
  --dim: rgba(245, 236, 220, .56);
  --faint: rgba(245, 236, 220, .22);
  --line: rgba(245, 236, 220, .16);
  --paper: #efe6d2;
  --f-en: 'Bodoni Moda', 'Bodoni 72', Didot, Georgia, serif;
  --f-num: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --f-ko-h: 'Hahmlet', 'Noto Serif KR', 'Nanum Myeongjo', 'AppleMyungjo', serif;
  --f-ko: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  --f-zh-h: 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', serif;
  --f-zh: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { margin: 0; height: 100%; background: #000; color: var(--ink); }
body { overflow: hidden; font-family: var(--f-ko); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }

#vp { position: fixed; inset: 0; background: #000; overflow: hidden; }
#vp.idle, #vp.idle * { cursor: none !important; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: #000; isolation: isolate; }
#stage > * { position: absolute; inset: 0; }
#bg { z-index: 0; }
#grade { z-index: 1; pointer-events: none; }
#scenes { z-index: 2; }
#mask { z-index: 3; width: 1920px; height: 1080px; pointer-events: none; }
#glow { z-index: 4; width: 1920px; height: 1080px; pointer-events: none; mix-blend-mode: screen; }
#fx { z-index: 4; width: 1920px; height: 1080px; pointer-events: none; mix-blend-mode: screen; }
#overlays { z-index: 5; pointer-events: none; }
/* the grain moves by transform (compositor only, no repaint); oversized so its edges never show */
#stage > #grain { inset: -128px; z-index: 6; pointer-events: none; mix-blend-mode: overlay; opacity: .08; visibility: hidden; background-size: 256px 256px; animation: grain .6s steps(6) infinite; transition: opacity 1.8s linear; }
#vignette { display: none; }   /* drawn into the darkness canvas instead */
#video { z-index: 8; pointer-events: none; }
#subs { z-index: 9; pointer-events: none; }
#hud { z-index: 10; pointer-events: none; }
#overview { z-index: 11; }
#flash { z-index: 12; pointer-events: none; background: #f4f7ff; opacity: 0; }
/* full-screen layers that are only sometimes on are hidden while transparent, so they need no backing store */
#black { z-index: 13; pointer-events: none; background: #000; opacity: 0; visibility: hidden; }
#flash { visibility: hidden; }
#bkey { z-index: 14; pointer-events: none; background: #000; opacity: 0; visibility: hidden; transition: opacity .45s ease, visibility 0s linear .45s; }
#bkey.on { opacity: 1; visibility: visible; transition: opacity .45s ease, visibility 0s; }
@keyframes grain {
  0% { transform: translate(0, 0); } 17% { transform: translate(-61px, 37px); } 33% { transform: translate(83px, -21px); }
  50% { transform: translate(-17px, -94px); } 67% { transform: translate(49px, 71px); } 83% { transform: translate(-88px, 12px); } 100% { transform: translate(0, 0); }
}

/* era background plates crossfade (A/B) */
.bgl { position: absolute; inset: 0; opacity: 0; transition: opacity 1.8s linear; }
.bgl.on { opacity: 1; }
#ytbg { position: absolute; inset: 0; opacity: 0; transition: opacity 2s linear; filter: saturate(.7) brightness(.42) contrast(1.05); }
#ytbg.on { opacity: .55; }
#ytbg > div, #ytbg iframe { position: absolute; inset: -6%; width: 112%; height: 112%; border: 0; opacity: 0; transition: opacity 1.6s linear; }
#ytbg > .on { opacity: 1; }

/* ── scenes & beats ─────────────────────────────────────────── */
.scene { position: absolute; inset: 0; visibility: hidden; opacity: 0; }
.scene.active { visibility: visible; opacity: 1; }
.scene.leaving { visibility: visible; }
/* scenes that are neither on stage nor fading out are out of the render tree: no style, no layers, no animations */
.scene:not(.active):not(.leaving) { display: none; }
.a { position: absolute; }
.ac { translate: -50% -50%; }
.ax { translate: -50% 0; }
.ay { translate: 0 -50%; }
.ar { translate: -100% -50%; }
.ab { translate: -50% -100%; }

/* reveal system: elements carry data-show="2" (from beat 2) or "1-3"; the director toggles .on / .gone */
.rv { opacity: 0; transition: opacity .9s var(--e-stage), transform .9s var(--e-stage), filter .9s var(--e-stage), color .9s var(--e-stage); transition-delay: var(--d, 0s); }
.rv.up { transform: translateY(30px); }
.rv.down { transform: translateY(-30px); }
.rv.left { transform: translateX(-48px); }
.rv.right { transform: translateX(48px); }
.rv.zoom { transform: scale(.93); }
.rv.big { transform: scale(1.08); }
.rv.blur { filter: blur(14px); }
.rv.drop { transform: translateY(-80px) scale(1.15); transition-timing-function: var(--e-drop); }
.rv.slow { transition-duration: 1.6s; }
.rv.fast { transition-duration: .5s; }
.rv.on { opacity: 1; transform: none; filter: none; }
.rv.gone { opacity: 0; transform: none; filter: blur(8px); transition-delay: 0s; transition-duration: .6s; }
.rv.dimmed.on { opacity: .28; filter: blur(1.5px); }
#stage.rev .rv { transition-duration: .32s !important; transition-delay: 0s !important; }
#stage.instant *, #stage.instant *::before, #stage.instant *::after { transition: none !important; animation-delay: 0s !important; }

/* ── bilingual text: one node holds ko + zh, the stage shows one or both ── */
.t > .ko, .t > .zh { display: inline; }
[data-lang="ko"] .t > .zh, [data-lang="zh"] .t > .ko { display: none; }
[data-lang="bi"] .t { display: inline-block; }
[data-lang="bi"] .t > .ko { display: block; }
[data-lang="bi"] .t > .zh { display: block; font-size: .55em; opacity: .6; margin-top: .42em; line-height: 1.35; letter-spacing: 0; font-weight: 400; }
.t .ko { font-family: inherit; }
.serif .ko, .ko.serif { font-family: var(--f-ko-h); }
.serif .zh, .zh.serif { font-family: var(--f-zh-h); }
.sans .ko { font-family: var(--f-ko); }
.sans .zh { font-family: var(--f-zh); }
.t .zh { font-family: var(--f-zh); }
.serif .t .zh, .t.serif .zh { font-family: var(--f-zh-h); }
.t.serif .ko { font-family: var(--f-ko-h); }
.t.sans .ko { font-family: var(--f-ko); }
.t.sans .zh { font-family: var(--f-zh); }
:lang(zh) { word-break: normal; }
.t .ko, :lang(ko) { word-break: keep-all; overflow-wrap: break-word; }
.en { font-family: var(--f-en); }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums lining-nums; }
.mono { font-family: var(--f-mono); }
.kicker { font-family: var(--f-num); text-transform: uppercase; letter-spacing: .32em; font-weight: 500; font-size: 22px; color: var(--dim); }
.k-ko { font-family: var(--f-ko); letter-spacing: .08em; }
.acc { color: var(--acc); }
.dim { color: var(--dim); }
h1, h2, h3, p { margin: 0; font-weight: inherit; }
.bal { text-wrap: balance; }
em { font-style: normal; color: var(--acc); }

/* operator UI layer (real pixels) */
#ui { position: fixed; inset: 0; pointer-events: none; z-index: 50; font-family: var(--f-zh), var(--f-ko); }
#ui > * { pointer-events: auto; }
.toast-wrap { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom, 0px)); translate: -50% 0; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none !important; }
.toast { background: rgba(18, 16, 14, .92); border: 1px solid rgba(255, 233, 196, .22); color: #f3e9d8; padding: 10px 16px; border-radius: 10px; font-size: 14px; line-height: 1.45; box-shadow: 0 10px 30px rgba(0,0,0,.45); max-width: min(560px, calc(100vw - 32px)); opacity: 0; translate: 0 8px; transition: opacity .25s ease, translate .25s ease; pointer-events: auto; }
.toast.show { opacity: 1; translate: 0 0; }
.toast a { color: #ffd08a; }
#hint { position: fixed; left: 16px; right: 16px; bottom: max(28px, env(safe-area-inset-bottom, 0px)); z-index: 40; color: rgba(245,236,220,.5); font: 13px/1.6 var(--f-zh); letter-spacing: .04em; text-align: center; transition: opacity .6s ease; pointer-events: none; padding-inline: 16px; }
#hint kbd { font-family: var(--f-mono); font-size: 12px; border: 1px solid rgba(245,236,220,.28); border-radius: 4px; padding: 1px 6px; margin: 0 2px; color: rgba(245,236,220,.75); }
#hint .hk { display: inline-block; white-space: nowrap; margin: 2px 10px; }
#hint .hint-demo { pointer-events: auto; margin-top: 12px; appearance: none; border: 1px solid rgba(255, 208, 138, .45); background: rgba(20, 16, 12, .6); color: #ffd08a; font: 500 13px/1 var(--f-zh); padding: 9px 16px; border-radius: 999px; cursor: pointer; letter-spacing: .06em; }
#hint .hint-demo:hover, #hint .hint-demo:focus-visible { background: rgba(255, 208, 138, .12); outline: none; border-color: #ffd08a; }
body.fs #hint, body.started #hint { opacity: 0; }
body.fs #hint .hint-demo, body.started #hint .hint-demo { pointer-events: none; }

@media (prefers-reduced-motion: reduce) {
  #grain { animation: none; }
}
#stage.reduced .rv { transition-duration: .2s !important; transition-delay: 0s !important; transform: none !important; filter: none !important; }
#stage.reduced #grain { animation: none; }

/* ── 03b-quality ── */
/* ── quality tiers ──
   high      every effect
   standard  still film grain, no light-leak / scanline motion, half the particles, plain blending for the light layers
   low       phones and previews: no filters, no blend modes, no particles, no full-screen overlays */
#stage:not(.q-high) #grain, #stage:not(.q-high) #ov-leak::before, #stage:not(.q-high) #ov-leak::after, #stage:not(.q-high) #ov-scan::after { animation: none !important; }
#stage:not(.q-high) #glow, #stage:not(.q-high) #fx { mix-blend-mode: normal; }
#stage:not(.q-high) .smoke circle, #stage:not(.q-high) .twinkle circle { animation: none !important; }
#stage.q-low #grain, #stage.q-low .ov, #stage.q-low #ytbg, #stage.q-low #fx, #stage.q-low #grade { display: none !important; }
#stage.q-low *:not(.fg-fx), #stage.q-low *::before, #stage.q-low *::after { filter: none !important; backdrop-filter: none !important; mix-blend-mode: normal !important; }
#stage.q-low #glow { opacity: .8; }

/* ── 05-era ── */
/* era films: overlays that change with the decade */
.ov { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity 1.8s linear; pointer-events: none; }
#ov-leak { mix-blend-mode: screen; }
/* the leaks are soft radial gradients already; a 60px blur on top cost a full-screen filter every frame */
#ov-leak::before, #ov-leak::after { content: ''; position: absolute; border-radius: 50%; }
#ov-leak::before { width: 1020px; height: 1220px; left: -580px; top: -180px; background: radial-gradient(closest-side, rgba(255, 128, 40, .62), rgba(255, 90, 30, .3) 35%, rgba(255, 70, 20, .12) 62%, transparent); animation: leakA 11s ease-in-out infinite alternate; }
#ov-leak::after { width: 880px; height: 1020px; right: -520px; bottom: -320px; background: radial-gradient(closest-side, rgba(255, 196, 80, .5), rgba(255, 140, 60, .24) 35%, rgba(255, 90, 40, .1) 62%, transparent); animation: leakB 13s ease-in-out infinite alternate; }
@keyframes leakA { 0% { transform: translate(0, 0) scale(1); opacity: .65; } 45% { opacity: 1; } 100% { transform: translate(120px, 80px) scale(1.15); opacity: .5; } }
@keyframes leakB { 0% { transform: translate(0, 0); opacity: .5; } 60% { opacity: .95; } 100% { transform: translate(-140px, -60px) scale(1.1); opacity: .7; } }
#ov-scan { background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, .28) 0 1px, transparent 1px 3px); }
#ov-scan::after { content: ''; position: absolute; left: 0; right: 0; height: 260px; top: -260px; background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, .035), transparent); animation: roll 8s linear infinite; }
@keyframes roll { to { transform: translateY(1600px); } }
#ov-cold { background: linear-gradient(180deg, rgba(120, 140, 170, .16), rgba(40, 50, 70, .22)); mix-blend-mode: color; }
#ov-warm { background: radial-gradient(ellipse 80% 70% at 50% 75%, rgba(255, 168, 70, .32), transparent 72%); mix-blend-mode: soft-light; }
#stage.desat #scenes, #stage.desat #bg { filter: saturate(.3) contrast(1.02); }
#scenes, #bg { transition: filter 1.8s linear; }
#stage.reduced #ov-leak::before, #stage.reduced #ov-leak::after, #stage.reduced #ov-scan::after { animation: none; }

/* ── 07-video ── */
/* video layer: slots sit above the darkness, so a playing screen glows in the dark room */
/* a slot that is off is hidden once it has faded, so an idle 1920×1080 black box needs no layer */
.vslot { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; opacity: 0; visibility: hidden; transition: opacity .6s ease, visibility 0s linear .6s, left .8s var(--e-stage), top .8s var(--e-stage), width .8s var(--e-stage), height .8s var(--e-stage); overflow: hidden; background: #000; }
.vslot.on { opacity: 1; visibility: visible; transition: opacity .6s ease, visibility 0s, left .8s var(--e-stage), top .8s var(--e-stage), width .8s var(--e-stage), height .8s var(--e-stage); }
.vslot .vs-yt, .vslot .vs-yt iframe, .vslot .vs-file { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
.vslot .vs-yt { opacity: 0; transition: opacity .5s ease; }
.vslot.playing .vs-yt { opacity: 1; }
.vslot .vs-file { object-fit: cover; opacity: 0; transition: opacity .5s ease; background: #000; }
.vslot.file .vs-file { opacity: 1; }
.vslot .vs-fb { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; color: #efe8da;
  background: radial-gradient(ellipse at 50% 45%, #1d1a16, #0a0908 70%); pointer-events: auto; padding: 40px; }
.vslot.fallback .vs-fb { display: flex; }
.vslot.fallback .vs-yt, .vslot.fallback .vs-file { opacity: 0 !important; }
.vs-fb .fb-k { font: 600 22px/1 var(--f-num); letter-spacing: .4em; color: rgba(239, 232, 218, .5); text-transform: uppercase; }
.vs-fb .fb-t { font: 500 64px/1.2 var(--f-ko-h); }
.vs-fb .fb-t .zh { font-family: var(--f-zh-h); }
.vs-fb .fb-y { font: 500 30px/1 var(--f-num); letter-spacing: .3em; color: rgba(239, 232, 218, .6); }
.vs-fb a { font: 500 24px/1 var(--f-ko); color: #ffd08a; text-decoration: none; border-bottom: 1px solid rgba(255, 208, 138, .4); padding-bottom: 4px; }
.vs-fb .fb-play { width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(239, 232, 218, .5); position: relative; }
.vs-fb .fb-play::after { content: ''; position: absolute; left: 50%; top: 50%; translate: -38% -50%; border-left: 34px solid rgba(239, 232, 218, .8); border-top: 22px solid transparent; border-bottom: 22px solid transparent; }
#vs-tv .vs-fb, #vs-pip .vs-fb { gap: 10px; padding: 16px; }
#vs-tv .fb-t, #vs-pip .fb-t { font-size: 30px; }
#vs-tv .fb-k, #vs-pip .fb-k { font-size: 14px; }
#vs-tv .fb-play, #vs-pip .fb-play { width: 60px; height: 60px; }
#vs-tv .fb-play::after, #vs-pip .fb-play::after { border-left-width: 18px; border-top-width: 12px; border-bottom-width: 12px; }
#vs-tv .vs-fb a, #vs-pip .vs-fb a { font-size: 16px; }
/* CRT glass on the TV slot */
#vs-tv { border-radius: 46px / 40px; background: #050505; }
#vs-tv::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,.32) 0 2px, transparent 2px 4px), radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.65) 100%), linear-gradient(135deg, rgba(255,255,255,.1), transparent 35%);
  box-shadow: inset 0 0 60px rgba(0,0,0,.8); }
#vs-tv .vs-yt { filter: saturate(1.15) contrast(1.1); }
#vs-pip { border: 3px solid rgba(241, 234, 214, .85); box-shadow: 0 20px 60px rgba(0,0,0,.6); }
#vs-pip::before { content: '45°  ·  LOOP'; position: absolute; left: 14px; top: 10px; z-index: 2; font: 600 16px/1 var(--f-num); letter-spacing: .25em; color: rgba(241, 234, 214, .85); text-shadow: 0 1px 6px #000; }
#vs-main.framed { box-shadow: 0 0 0 2px rgba(241, 234, 214, .25), 0 40px 120px rgba(0,0,0,.7); }
#leader { position: absolute; inset: 0; width: 1920px; height: 1080px; opacity: 0; visibility: hidden; transition: opacity .25s linear, visibility 0s linear .25s; }
#leader.on { opacity: 1; visibility: visible; transition: opacity .25s linear, visibility 0s; }
/* subtitle strip for cue captions */
#subs .sub { position: absolute; left: 50%; bottom: 74px; translate: -50% 0; max-width: 1500px; text-align: center; font: 500 40px/1.35 var(--f-ko); color: #fff;
  text-shadow: 0 2px 4px rgba(0,0,0,.9), 0 0 24px rgba(0,0,0,.8); opacity: 0; visibility: hidden; transition: opacity .4s ease, visibility 0s linear .4s; }
#subs .sub .zh { font-family: var(--f-zh); }
#subs .sub.on { opacity: 1; visibility: visible; transition: opacity .4s ease, visibility 0s; }

/* ── 08-hud ── */
/* three persistent audience elements: act·chapter, year flip-board, now playing */
#hud > * { position: absolute; transition: opacity .9s var(--e-stage), transform .9s var(--e-stage); }
#hud.off > * { opacity: 0 !important; }
.am { left: 96px; top: 58px; padding-left: 18px; border-left: 2px solid var(--acc); opacity: 0; }
.am.on { opacity: 1; }
.am-k { font: 500 19px/1 var(--f-num); letter-spacing: .3em; color: var(--dim); text-transform: uppercase; }
.am-k .ko { font-family: var(--f-ko); letter-spacing: .14em; font-size: 17px; font-weight: 500; }
.am-k .zh { font-family: var(--f-zh); letter-spacing: .14em; font-size: 17px; }
.am-t { margin-top: 9px; font: 500 26px/1.15 var(--f-ko-h); color: var(--ink); }
.am-t .zh { font-family: var(--f-zh-h); }
[data-lang="bi"] .am-t .zh, [data-lang="bi"] .am-k .zh { margin-top: 4px; }
.am-swap { animation: amSwap .9s var(--e-stage); }
@keyframes amSwap { from { opacity: 0; transform: translateY(-8px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }

.yr { right: 96px; bottom: 54px; display: flex; gap: 5px; opacity: 0; perspective: 400px; }
.yr.on { opacity: 1; }
.fd { position: relative; width: 46px; height: 66px; border-radius: 5px; background: #16130f; box-shadow: 0 6px 18px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.06); font: 600 52px/66px var(--f-num); color: var(--ink); text-align: center; }
.fd > div { position: absolute; left: 0; right: 0; height: 50%; overflow: hidden; background: inherit; border-radius: inherit; }
.fd > div > span { position: absolute; left: 0; right: 0; height: 66px; line-height: 66px; }
.fd .t1, .fd .f1 { top: 0; border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.fd .t1 > span, .fd .f1 > span { top: 0; }
.fd .b1, .fd .f2 { bottom: 0; border-top-left-radius: 0; border-top-right-radius: 0; }
.fd .b1 > span, .fd .f2 > span { bottom: 0; }
.fd .f1 { transform-origin: 50% 100%; z-index: 2; backface-visibility: hidden; display: none; }
.fd .f2 { transform-origin: 50% 0; z-index: 2; backface-visibility: hidden; transform: rotateX(90deg); display: none; }
.fd::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: rgba(0,0,0,.65); z-index: 3; }
.fd .t1::after, .fd .f1::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(255,255,255,.05), rgba(0,0,0,.12)); }

.np { left: 96px; bottom: 54px; display: flex; align-items: center; gap: 18px; opacity: 0; transform: translateY(16px); }
.np.on { opacity: 1; transform: none; }
.np-art { position: relative; width: 78px; height: 78px; flex: none; }
.np-vinyl { position: absolute; left: 22px; top: 3px; width: 72px; height: 72px; border-radius: 50%;
  background: radial-gradient(circle, var(--np-c, #c33) 0 15%, #111 16% 18%, transparent 18.5%), repeating-radial-gradient(circle, #0c0c0c 0 1.5px, #1d1d1d 2px 3px); box-shadow: 0 2px 10px rgba(0,0,0,.6);
  transition: left 1.2s var(--e-stage) .3s; animation: spin 1.8s linear infinite; animation-play-state: paused; }
.np.on .np-vinyl { left: 40px; animation-play-state: running; }
.np-vinyl::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 30deg, transparent 0 10%, rgba(255,255,255,.12) 14%, transparent 20% 60%, rgba(255,255,255,.08) 66%, transparent 72%); }
.np-cover { position: absolute; inset: 0; border-radius: 3px; overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,.6); z-index: 2; display: grid; place-items: center; }
.np-cover b { font: italic 600 30px/1 var(--f-en); letter-spacing: -.02em; }
.np-cover i { position: absolute; right: 6px; bottom: 5px; font: 600 11px/1 var(--f-num); letter-spacing: .12em; font-style: normal; opacity: .8; }
.np-meta { padding-left: 22px; }
.np-k { font: 600 14px/1 var(--f-num); letter-spacing: .34em; color: var(--acc); }
.np-k::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--acc); margin-right: 9px; vertical-align: 1px; }
.np.on .np-k::before { animation: pulse 1.2s ease-in-out infinite; }
.np-t { margin-top: 8px; font: italic 500 26px/1.1 var(--f-en); color: var(--ink); white-space: nowrap; }
.np-a { margin-top: 6px; font: 500 15px/1 var(--f-num); letter-spacing: .18em; color: var(--dim); text-transform: uppercase; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { opacity: .3; } }

/* ── 09-figure ── */
/* the rigged figure */
.fig { position: absolute; display: block; overflow: visible; pointer-events: none; }
.fig .tw { animation: tw 1.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
#stage:not(.q-high) .fig .tw { animation: none; opacity: .75; }
.fig .tw-g:nth-child(2n) .tw { animation-delay: .5s; } .fig .tw-g:nth-child(3n) .tw { animation-delay: 1s; } .fig .tw-g:nth-child(5n) .tw { animation-delay: .25s; }
.scene .fig .fg-hit { pointer-events: all; }

/* ── 10-components ── */
/* ── shared scene vocabulary ───────────────────────────────── */
.scene { color: var(--ink); }
.h-xl { font: 600 128px/1.08 var(--f-ko-h); letter-spacing: -.01em; }
.h-l { font: 600 96px/1.12 var(--f-ko-h); letter-spacing: -.005em; }
.h-m { font: 500 64px/1.2 var(--f-ko-h); }
.h-s { font: 500 46px/1.3 var(--f-ko-h); }
.b-l { font: 400 40px/1.45 var(--f-ko); }
.b-m { font: 400 32px/1.5 var(--f-ko); }
.b-s { font: 400 26px/1.5 var(--f-ko); }
.h-xl .zh, .h-l .zh, .h-m .zh, .h-s .zh { font-family: var(--f-zh-h); }
.b-l .zh, .b-m .zh, .b-s .zh { font-family: var(--f-zh); }
.big { font: 600 360px/.86 var(--f-num); letter-spacing: -.01em; font-variant-numeric: tabular-nums lining-nums; }
.big2 { font: 600 220px/.9 var(--f-num); letter-spacing: -.005em; font-variant-numeric: tabular-nums lining-nums; }
.lab { font: 500 22px/1.2 var(--f-num); letter-spacing: .34em; text-transform: uppercase; color: var(--dim); }
.lab .ko, .lab .zh { letter-spacing: .12em; font-size: 21px; }
.lab .ko { font-family: var(--f-ko); } .lab .zh { font-family: var(--f-zh); }
.rule { height: 1px; background: linear-gradient(90deg, transparent, var(--line) 15%, var(--line) 85%, transparent); }
.center { text-align: center; }
.nowrap { white-space: nowrap; }

/* act card */
.actc { width: 1400px; text-align: center; }
.actc .ac-n { font: 600 190px/1 var(--f-ko-h); letter-spacing: -.02em; }
.actc .ac-n .zh { font-family: var(--f-zh-h); }
.actc .ac-name { margin-top: 26px; font: 400 64px/1.2 var(--f-ko-h); color: var(--acc); }
.actc .ac-name .zh { font-family: var(--f-zh-h); }
.actc .ac-y { margin-top: 26px; font: 500 30px/1 var(--f-num); letter-spacing: .4em; color: var(--dim); }

/* chapter card */
.cc { width: 1500px; text-align: center; transition: transform 1.1s var(--e-stage), opacity .9s var(--e-stage); transform-origin: 50% 0; }
.cc .cc-num { font: 400 210px/.9 var(--f-en); color: var(--acc); letter-spacing: .02em; }
.cc .cc-title { margin-top: 18px; font: 600 112px/1.08 var(--f-ko-h); }
.cc .cc-title .zh { font-family: var(--f-zh-h); }
.cc .cc-en { margin-top: 18px; font-size: 64px; line-height: 1.05; color: var(--acc2); }
.cc .cc-y { margin-top: 26px; font: 500 34px/1 var(--f-num); letter-spacing: .42em; color: var(--dim); }
.cc .cc-y .zh, .cc .cc-y .ko { letter-spacing: .16em; }
.cc.docked { transform: translateY(var(--dock-y, -300px)) scale(.42); }
[data-lang="zh"] .cc.endup .cc-en { display: none; }

/* roadmap */
.road { width: 1640px; height: 230px; }
.road svg { position: absolute; inset: 0; overflow: visible; }
.road .rd-act { position: absolute; top: 0; text-align: center; translate: -50% 0; }
.road .rd-act .t { font: 500 26px/1.2 var(--f-ko-h); white-space: nowrap; }
.road .rd-act .t .zh { font-family: var(--f-zh-h); }
.road .rd-act small { display: block; margin-top: 8px; font: 500 18px/1 var(--f-num); letter-spacing: .3em; color: var(--dim); }
.road .rd-node { position: absolute; top: 118px; translate: -50% -50%; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
  font: 500 20px/1 var(--f-en); color: var(--ink); background: #0b0a09; border: 1.5px solid var(--faint); transition: all .6s var(--e-stage); }
.road .rd-node.seoul { width: 26px; height: 26px; border-radius: 3px; rotate: 45deg; font-size: 0; }
.road .rd-node.lit { border-color: var(--acc); color: #120d08; background: var(--acc); box-shadow: 0 0 24px var(--acc); }
.road .rd-node.past { border-color: var(--acc); color: var(--acc); }
.road .rd-y { position: absolute; top: 160px; translate: -50% 0; font: 500 19px/1 var(--f-num); letter-spacing: .14em; color: var(--dim); white-space: nowrap; }
.road .rd-dot { position: absolute; top: 118px; width: 16px; height: 16px; border-radius: 50%; translate: -50% -50%; background: #fff6e3; box-shadow: 0 0 22px 8px rgba(255, 220, 160, .55); transition: left 2.4s var(--e-spot); }
.road.clickable .rd-node { pointer-events: auto; cursor: pointer; }
.road.clickable .rd-node:hover { border-color: var(--acc); }

/* slate (clapperboard) */
.slate { width: 640px; height: 470px; }
.slate .sl-body { position: absolute; left: 0; right: 0; bottom: 0; height: 380px; background: linear-gradient(180deg, #1b1b1c, #121213); border-radius: 6px 6px 10px 10px; box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,255,255,.05); padding: 26px 30px; font-family: var(--f-mono); color: #ece8df; }
.slate .sl-stick { position: absolute; left: 0; right: 0; height: 56px; border-radius: 4px; background: repeating-linear-gradient(-58deg, #f2efe8 0 34px, #111 34px 68px); box-shadow: 0 4px 12px rgba(0,0,0,.5); }
.slate .sl-top { top: 34px; transform-origin: 14px 50%; transform: rotate(-24deg); transition: transform .32s cubic-bezier(.7, 0, .9, .5); }
.slate.clap .sl-top { transform: rotate(0deg); }
.slate .sl-base { top: 92px; background: repeating-linear-gradient(58deg, #f2efe8 0 34px, #111 34px 68px); height: 44px; }
.slate .sl-hinge { position: absolute; left: 4px; top: 50px; width: 22px; height: 22px; border-radius: 50%; background: #8a8a8a; box-shadow: inset 0 0 0 4px #555; z-index: 3; }
.slate .sl-grid { position: absolute; left: 26px; right: 26px; top: 66px; bottom: 24px; display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1.2fr; border: 2px solid rgba(236,232,223,.55); }
.slate .sl-cell { border: 1px solid rgba(236,232,223,.4); padding: 10px 14px; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
.slate .sl-cell.wide { grid-column: span 3; }
.slate .sl-cell.two { grid-column: span 2; }
.slate .sl-k { font: 500 15px/1 var(--f-mono); letter-spacing: .2em; color: rgba(236,232,223,.55); }
.slate .sl-v { font: 500 38px/1.05 var(--f-mono); letter-spacing: .02em; white-space: nowrap; overflow: hidden; }
.slate .sl-v.chalk { font-family: 'Permanent Marker', var(--f-mono); letter-spacing: .03em; color: #f6f2ea; }
.slate .redact { display: inline-block; width: 85%; height: 26px; background: rgba(236,232,223,.85); vertical-align: middle; }
.slate .sl-v .write { display: inline-block; clip-path: inset(0 100% 0 0); transition: clip-path 1.1s steps(14) .5s; }
.on > .slate .sl-v .write, .slate.written .sl-v .write { clip-path: inset(0 0 0 0); }
.slate .sl-v .fill { color: #ff6b5e; }

/* moonwalk line: words step forward while the whole line glides backward */
.mw { white-space: nowrap; }
.mw .mw-w { display: inline-block; }
.mw.go { animation: mwGlide 2.4s var(--e-sine) forwards; }
.mw.go .mw-w { animation: mwStep .6s ease-in-out 4; animation-delay: calc(var(--i) * .07s); }
@keyframes mwGlide { from { transform: translateX(var(--mw-from, 220px)); } to { transform: translateX(0); } }
@keyframes mwStep { 0% { transform: translateX(0) translateY(0) skewX(0); } 35% { transform: translateX(14px) translateY(-7px) skewX(-8deg); } 60% { transform: translateX(10px) translateY(0) skewX(-3deg); } 100% { transform: translateX(0) translateY(0) skewX(0); } }

/* record sleeves (shared, skinned per era) */
.sleeves { display: flex; gap: 40px; }
.slv { position: relative; width: 300px; height: 300px; flex: none; }
.slv .slv-disc { position: absolute; top: 12px; left: 12px; width: 276px; height: 276px; border-radius: 50%; background: radial-gradient(circle, var(--lbl, #e2672b) 0 17%, #111 17.5% 19%, transparent 19.5%), repeating-radial-gradient(circle, #0d0d0d 0 1.6px, #1e1e1e 2px 3.2px); transition: transform 1.2s var(--e-stage) .35s; box-shadow: 0 10px 30px rgba(0,0,0,.6); }
.slv.on .slv-disc { transform: translateX(70px) rotate(220deg); }
.slv .slv-face { position: absolute; inset: 0; border-radius: 3px; overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,.55); display: flex; flex-direction: column; justify-content: space-between; padding: 22px; }
.slv .slv-t { font-size: 34px; line-height: 1.02; }
.slv .slv-y { font: 600 24px/1 var(--f-num); letter-spacing: .2em; }
.stamp { position: absolute; right: -26px; top: -26px; width: 128px; height: 128px; border-radius: 50%; border: 5px solid #d8262e; color: #d8262e; display: grid; place-items: center; text-align: center; rotate: -14deg;
  font: 700 46px/.9 var(--f-num); letter-spacing: -.01em; background: radial-gradient(circle, rgba(255,240,230,.0), rgba(255,240,230,0)); opacity: 0; transform: scale(2.2); mix-blend-mode: normal; z-index: 4; }
.stamp small { display: block; font: 600 15px/1 var(--f-num); letter-spacing: .2em; margin-top: 6px; }
.stamp::before { content: ''; position: absolute; inset: 7px; border-radius: 50%; border: 2px solid currentColor; opacity: .7; }
.stamp.on { animation: stampIn .42s cubic-bezier(.2, 1.4, .4, 1) forwards; }
@keyframes stampIn { 0% { opacity: 0; transform: scale(2.2); } 60% { opacity: .95; transform: scale(.94); } 100% { opacity: .92; transform: scale(1); } }

/* gramophone row */
.gram { width: 92px; height: 108px; color: var(--acc); opacity: .18; transition: opacity .5s ease, filter .5s ease; }
.gram.on { opacity: 1; filter: drop-shadow(0 0 14px rgba(255, 210, 120, .45)); }
.gram svg { width: 100%; height: 100%; overflow: visible; }

/* tags & chips */
.tag { display: inline-flex; align-items: center; gap: 12px; padding: 10px 20px 10px 16px; border-radius: 999px; border: 1px solid var(--faint); font: 500 28px/1.2 var(--f-ko); color: var(--ink); background: rgba(0,0,0,.25); white-space: nowrap; }
.tag .zh { font-family: var(--f-zh); }
.tag::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--acc); }
.note-hand { font-family: 'Nanum Pen Script', var(--f-ko); font-size: 54px; line-height: 1; color: var(--acc2); }
.note-hand .zh { font-family: 'Long Cang', var(--f-zh); font-size: .8em; }

/* ── 10b-interact ── */
/* ── interaction layer: the clicker drives the show; the pointer may explore it ── */
.scene * { pointer-events: none; }
.scene .tilt, .scene .hov { pointer-events: auto; }
.scene .tilt *, .scene .hov *, .scene .int *, .scene .drag * { pointer-events: none; }
.scene .int, .scene .drag, .scene .tilt .int, .scene .tilt .drag, .scene .hov .int, .scene .hov .drag { pointer-events: auto; }
/* nothing that is faded out may catch the pointer */
.scene .rv:not(.on) .tilt, .scene .rv:not(.on) .hov, .scene .rv:not(.on) .int, .scene .rv:not(.on) .drag, .scene .rv:not(.on) .fg-hit,
.scene .rv.tilt:not(.on), .scene .rv.int:not(.on), .scene .rv.drag:not(.on), .scene .rv.hov:not(.on) { pointer-events: none !important; }
/* on a phone the stage is for watching: taps anywhere turn the page, nothing on stage swallows them */
#stage.touch .scene .tilt, #stage.touch .scene .hov, #stage.touch .scene .int, #stage.touch .scene .drag, #stage.touch .scene .fg-hit { pointer-events: none !important; }
.scene .int { cursor: pointer; }
.scene .drag { cursor: grab; touch-action: none; }
.scene .drag:active, .scene .drag.grabbing { cursor: grabbing; }
#vp.idle .scene .int, #vp.idle .scene .drag { cursor: none; }

.figbox { width: 0; height: 0; }
.pool { position: absolute; border-radius: 50%; translate: -50% -50%; background: radial-gradient(ellipse at 50% 50%, rgba(255, 214, 160, .2), rgba(255, 190, 120, .07) 48%, transparent 70%); }

/* depth layers drift against the pointer. They carry no transform at rest: a full-screen layer with a 3D
   transform is its own composited layer, and on Safari each one costs (1920×1080 × pixel ratio²) of memory */
.layer { position: absolute; inset: 0; }
.scene.px-live > .layer { will-change: transform; }
#stage.reduced .layer { transform: none !important; }

/* cards that lean toward the pointer (3D only while the pointer is on them) */
.tilt { transition: transform .7s var(--e-stage); }
.tilt.hot { transform: perspective(1200px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition-duration: .16s; }
.tilt > .glare { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 9; opacity: 0; transition: opacity .5s ease;
  background: radial-gradient(circle at var(--gx, 50%) var(--gy, 30%), rgba(255, 250, 240, .26), rgba(255, 250, 240, .06) 28%, transparent 58%); mix-blend-mode: screen; }
.tilt.hot > .glare { opacity: 1; }
#stage.reduced .tilt { transform: none !important; }

/* a whisper that appears next to things you can touch, only while the pointer is moving */
.itip { position: absolute; z-index: 30; padding: 7px 14px 7px 12px; border-radius: 999px; border: 1px solid rgba(255, 220, 170, .35); background: rgba(10, 8, 6, .62);
  font: 500 19px/1 var(--f-ko); color: rgba(255, 233, 200, .86); white-space: nowrap; opacity: 0; translate: -50% 8px; transition: opacity .5s ease, translate .5s var(--e-stage); pointer-events: none !important; }
.itip .zh { font-family: var(--f-zh); }
.itip::before { content: ''; display: inline-block; width: 8px; height: 8px; margin-right: 9px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 10px var(--acc); vertical-align: 1px; }
#stage.pointing .scene.active .itip.on::before { animation: itipP 1.6s ease-in-out infinite; }
@keyframes itipP { 50% { opacity: .35; } }
#stage.pointing .scene.active .itip.on { opacity: 1; translate: -50% 0; }

/* ── 10c-photos ── */
/* ── photographs: real prints of him, pinned into the scenes ── */
.photo { padding: 12px 12px 0; background: #f2ebdd; box-shadow: 0 26px 60px rgba(0, 0, 0, .62), 0 2px 0 rgba(255, 255, 255, .12) inset; border-radius: 2px; }
.photo .ph-img { position: relative; overflow: hidden; background: #1b1714; }
.photo img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: var(--pos, 50% 25%); filter: contrast(1.04) saturate(.9); }
.photo .ph-cap { padding: 11px 4px 4px; font: 500 21px/1.25 var(--f-ko); color: #2a221a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.photo .ph-cap .zh { font-family: var(--f-zh); }
[data-lang="bi"] .photo .ph-cap .zh { opacity: .75; }
.photo .ph-cr { padding: 2px 4px 10px; font: 500 11px/1.3 var(--f-num); letter-spacing: .06em; color: rgba(42, 34, 26, .55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.photo-w.nophoto { display: none; }

/* ── 12-scenes-prologue ── */
/* ── prologue: cold open · trailer · title ── */
[data-scene="cold"] { --rim: #ffd9a0; }
.twinkle circle { animation: tw 1.6s ease-in-out infinite; }
.twinkle circle:nth-child(2n) { animation-delay: .5s; } .twinkle circle:nth-child(3n) { animation-delay: 1.1s; }
@keyframes tw { 0%, 100% { opacity: 0; transform: scale(.4); } 50% { opacity: 1; transform: scale(1.4); } }
.twinkle circle { transform-box: fill-box; transform-origin: center; }
.sweep-line { height: 2px; background: linear-gradient(90deg, var(--acc), transparent); transform: scaleX(0); transform-origin: 0 50%; }
.sweep-line.on { transform: scaleX(1); transition: transform 2.6s linear .5s, opacity .6s ease; }
.q-dark { color: #c9d3e2; text-shadow: 0 0 40px rgba(150, 175, 220, .25); }

/* cold open */
.cold-sl .slate { rotate: -5deg; }
.cold-cap { display: flex; align-items: center; gap: 22px; font: 400 30px/1.4 var(--f-ko); color: var(--dim); white-space: nowrap; }
.cold-cap .zh { font-family: var(--f-zh); }
.cold-cap i { display: block; width: 96px; height: 1px; background: var(--faint); }
.cold-v { writing-mode: vertical-rl; display: flex; gap: 30px; align-items: center; white-space: nowrap; }
.cold-v b { font: 400 268px/1 var(--f-en); color: transparent; -webkit-text-stroke: 1.6px rgba(255, 214, 160, .62); letter-spacing: .03em; font-weight: 400; }
.cold-v span { font: 500 19px/1 var(--f-num); letter-spacing: .52em; color: var(--dim); }
.cold-k { font: 500 24px/1 var(--f-num); letter-spacing: .44em; color: var(--acc); white-space: nowrap; }
.cold-k::after { content: ''; display: inline-block; width: 120px; height: 1px; margin-left: 22px; vertical-align: middle; background: rgba(255, 208, 138, .5); }
.callout { display: flex; align-items: baseline; gap: 18px; font: 500 36px/1.25 var(--f-ko-h); white-space: nowrap; }
.callout .zh { font-family: var(--f-zh-h); }
.callout.r { flex-direction: row-reverse; text-align: right; }
.callout b { font: 400 44px/1 var(--f-en); color: var(--acc); font-weight: 400; }
.leaders { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
.leaders path { fill: none; stroke: rgba(255, 222, 176, .72); stroke-width: 1.6; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .9s var(--e-stage); }
.leaders path.on { stroke-dashoffset: 0; }
.leaders circle { fill: #ffe6c2; opacity: 0; transition: opacity .4s ease .55s; }
.leaders circle.on { opacity: 1; }
.mw-l { font: 600 92px/1.1 var(--f-ko-h); }
.mw-l .zh { font-family: var(--f-zh-h); }
.cold-big { font: 600 128px/1 var(--f-ko-h); letter-spacing: -.02em; white-space: nowrap; }
.cold-big .zh { font-family: var(--f-zh-h); }

/* trailer: a cinema, seen from the back rows */
.cine { width: 1080px; height: 540px; border-radius: 4px; transform: perspective(1700px) rotateY(-17deg); transform-origin: 100% 50%; transition: transform 1.4s var(--e-stage);
  background: radial-gradient(ellipse at 40% 40%, #1a2130, #080a10 72%); box-shadow: 0 0 0 1px rgba(220, 230, 245, .1), 0 0 140px rgba(150, 185, 255, .12); overflow: hidden; }
.cine::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, rgba(255, 255, 255, .06), transparent 40%); }
.cine .sc-in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.mv-k { font: 400 30px/1 var(--f-en); letter-spacing: .62em; color: #dfe9f5; margin-right: -.62em; }
.mv-t { margin-top: 26px; font: 600 150px/1 var(--f-ko-h); letter-spacing: -.01em; color: #f3f6fa; }
.mv-t .zh { font-family: var(--f-zh-h); }
.mv-y { margin-top: 30px; font: 500 28px/1 var(--f-num); letter-spacing: .5em; color: rgba(223, 233, 245, .7); margin-right: -.5em; }
.seats { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
.tr-when { font: 600 190px/.82 var(--f-num); letter-spacing: -.02em; color: #eef3fb; white-space: nowrap; }
.tr-when small { display: block; margin-top: 26px; font: 500 30px/1 var(--f-num); letter-spacing: .5em; color: rgba(223, 233, 245, .55); }
.tr-ask { font-family: 'Nanum Pen Script', var(--f-ko); font-size: 64px; line-height: 1; color: var(--acc2); rotate: -6deg; white-space: nowrap; }
.tr-ask .zh { font-family: 'Long Cang', var(--f-zh); font-size: .78em; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 20px 30px; align-items: baseline; }
.facts b { font: 500 20px/1 var(--f-num); letter-spacing: .36em; color: var(--dim); font-weight: 500; }

  background: linear-gradient(160deg, #3a2c1d, #1c140d); box-shadow: inset 0 0 0 1px rgba(255, 230, 190, .12); color: #f6e7cf; transition: background .8s ease, color .8s ease, box-shadow .8s ease; }

/* ── IV · Bad (midnight blue, Art Deco) ── */

      { ko: '1978년 개봉한 영화 〈위즈〉 작업에서, 그는 프로듀서 퀸시 존스를 만납니다.', zh: '在1978年上映的电影《新绿野仙踪》的拍摄中，他结识了制作人昆西·琼斯。', vis: '年代溶解 1975→1979，章节卡 II；两盏光相遇', mus: 'card', year: 1978 },
      { ko: '그리고 1979년 솔로 앨범 〈Off the Wall〉. 솔로 앨범으로는 처음으로 미국 톱10 싱글이 네 곡이나 나옵니다. 소년 가수가 어른 아티스트가 된 순간이었죠.', zh: '1979年，个人专辑《Off the Wall》发行，成为第一张诞生四支美国前十单曲的个人专辑。少年歌手，就此蜕变为真正的艺术家。', vis: '大号「4」+ 四首前十单曲' },
      { cont: true, ko: '이 앨범에서 그는 가성과 숨소리, 딸꾹질 같은 짧은 소리까지 리듬 악기처럼 씁니다. 지금도 그의 목소리를 듣자마자 알아보는 이유죠.', zh: '在这张专辑里，他把假声、呼吸声，甚至像打嗝一样的短促音，都当成节奏乐器来用——这也是今天我们一听就能认出他声音的原因。', vis: '声音纹理：示意声波上标出「가성 · 숨소리 · 딸꾹질」' },
      { ko: '하지만 그래미상은 단 하나뿐이었습니다. 그는 이 실망을 잊지 않았고, 다음 앨범에서 그대로 되갚아 줍니다.', zh: '但格莱美只给了他一个奖。他没有忘记这份失望，并在下一张专辑里加倍奉还。', vis: '「그래미 1」', year: 1980 },
    ] },
  { key: 'thriller', era: 'thriller', act: 1, budget: 105, year: 1982, hud: true, enter: 'dissolve', chapter: 'III',
    title: L('스릴러', '《Thriller》'), short: L('III Thriller', 'III Thriller'), track: 'billiejean',
    beats: [
      { silent: true, ko: '（말하지 않음 · 음악 2초）', zh: '（不说话，音乐上扬 2 秒）', vis: '章节卡 III 스릴러 1982 — 1984', mus: 'card', media: 2 },
      { ko: '1982년 11월, 〈Thriller〉. 전 세계 약 7천만 장, 역사상 가장 많이 팔린 앨범으로 꼽힙니다. 미국에서 공식 인증된 것만 3,400만 장입니다.', zh: '1982年11月，《Thriller》。全球约7000万张，被认为是史上最畅销的专辑；仅美国官方认证就有3400万张。', vis: '白金唱片矩阵 + 计数器 70,000,000' },
      { ko: '개국한 지 2년도 안 된 MTV는 흑인 아티스트의 뮤직비디오를 거의 틀지 않았습니다. 〈Billie Jean〉은 그 벽을 넘어 집중적으로 방영된 첫 사례들 가운데 하나가 됩니다.', zh: '开播还不到两年的 MTV 几乎不播黑人艺人的 MV。《Billie Jean》成为最早突破这道墙、被高频播放的作品之一。', vis: '显像管电视：换台雪花 →〈Billie Jean〉1983', year: 1983 },
      { ko: '그리고 처음에 말씀드린 그 밤. 1983년 3월 25일, 모타운 25주년 기념 공연이었습니다. 그날 그가 부른 〈Billie Jean〉은 공연 전체에서 유일하게 모타운 곡이 아니었고, 바로 그 무대에서 문워크가 처음 등장합니다.', zh: '还有开场说的那一晚——1983年3月25日，摩城唱片25周年纪念演出。那天他唱的《Billie Jean》是整场唯一一首非摩城歌曲，太空步也正是在这个舞台上首次登场。', vis: '场记板回扣「1983. 3. 25 — 모타운 25」+ 太空步滑移', year: 1983 },
      { optional: 'motown', ko: '5월 16일 방송, 4,700만 명이 넘는 사람들이 이 장면을 봤습니다.', zh: '5月16日播出，超过4700万人看到了这一幕。', vis: '（可选）摩城 25 片段约 15 秒；没设置视频就自动跳过', media: 15, video: { key: 'motown', slot: 'tv' }, mus: 'video', year: 1983 },
      { ko: '이듬해 그래미에서 그는 하룻밤에 트로피 여덟 개를 가져갑니다.', zh: '第二年的格莱美，他一夜捧走八座奖杯。', vis: '「그래미 8」', year: 1984 },
      { cut: true, cont: true, ko: '14분짜리 쇼트 필름 〈Thriller〉로 뮤직비디오를 영화의 영역까지 끌어올리면서요.', zh: '同时，14分钟的短片《Thriller》把 MV 提升到了电影的层次。', vis: '续：14 分钟短片胶片条', year: 1984 },
    ] },
  { key: 'bad', era: 'bad', act: 1, budget: 105, year: 1987, hud: true, enter: 'dissolve', chapter: 'IV',
    title: L('배드', '《Bad》'), short: L('IV Bad', 'IV Bad'), track: 'bad',
    beats: [

      { ko: '1987년 〈Bad〉. 이번에는 한 앨범에서 빌보드 1위 싱글이 다섯 곡. 이것도 역사상 처음이었습니다.', zh: '1987年《Bad》。这一次，一张专辑诞生了五支公告牌冠军单曲——同样是史上首次。', vis: '大号「5」+ 五张冠军封套' },
      { ko: '1988년 영화 〈문워커〉의 중심에는 이 작품이 있습니다. 1930년대 갱스터 클럽을 무대로 한 〈Smooth Criminal〉. 영화 〈마이클〉이 멈추는 바로 그해죠. 직접 보시죠.', zh: '1988年电影《月球漫步》的核心，就是这部作品——以1930年代黑帮俱乐部为舞台的《Smooth Criminal》。也正是电影《迈克尔》停下的那一年。我们直接来看。', vis: '电影画框就位「1988 · 〈문워커〉」；灯光开始变冷', year: 1988 },
      { silent: true, ko: '（영상 · 말하지 않음）', zh: '（播放视频，不说话）', vis: '提示点①：俱乐部登场（约 10 秒，到点自动停）', media: 10, video: { key: 'sc', slot: 'main', cue: 1 }, mus: 'video', year: 1988 },
      { silent: true, ko: '（영상 · 말하지 않음）', zh: '（播放视频，不说话）', vis: '提示点②：45° 倾斜（约 8 秒，到点自动停）', media: 8, video: { key: 'sc', slot: 'main', cue: 2 }, mus: 'video', year: 1988 },
      { ko: '방금 그 장면, 몸 전체가 앞으로 45도 기울어집니다. 숙련된 댄서도 30도 안팎이 한계라고 합니다.', zh: '刚才那个镜头，整个身体向前倾斜了45度。据说专业舞者的极限也只有30度左右。', vis: '45° 量角器 + 右侧画中画静音循环；↑↓ 现场调角度', year: 1988, keys: 'angle' },
      { ko: '뮤직비디오에서는 와이어를 썼지만, 라이브 무대에서는 그럴 수 없었죠. 그래서 그와 의상 디자이너들은 신발 뒤꿈치의 홈이 바닥에서 솟아오른 고정 장치에 걸리는 방식을 고안했고, 1993년 미국 특허를 받습니다.', zh: 'MV 里用了钢丝，但现场演出不行。于是他和服装设计师们想出一种方法：鞋跟的凹槽卡住从地面升起的固定钉，并在1993年拿到了美国专利。', vis: '专利示意：鞋跟凹槽 + 地面固定钉', year: 1988 },
      { cut: true, cont: true, ko: '그는 노래하는 사람이면서, 무대를 설계하는 사람이었습니다.', zh: '他是歌手，也是舞台的设计者。', vis: '续：发明人一栏', year: 1988 },
    ] },
  { key: 'dangerous', era: 'dangerous', act: 2, budget: 70, year: 1991, hud: true, enter: 'blackout', chapter: 'V',
    title: L('데인저러스', '《Dangerous》'), short: L('V Dangerous', 'V Dangerous'), track: 'bow',
    beats: [
      { ko: '1991년 〈Black or White〉의 뮤직비디오는 여러 나라에서 동시에 공개됩니다. 한 사람의 얼굴이 다른 사람의 얼굴로 자연스럽게 바뀌는 모핑 기술이 세상을 놀라게 했죠.', zh: '1991年，《Black or White》的 MV 在多个国家同步首播。一张脸自然变成另一张脸的「变形」特效，震惊了世界。', vis: '「2막 · 빛의 가장자리」→ 章节卡 V 데인저러스 1991 — 1993', mus: 'card', media: 2 },
      { ko: '1993년 1월, 슈퍼볼 하프타임. 그는 무대에 나타난 뒤, 이렇게 서 있었습니다.', zh: '1993年1月，超级碗中场秀。他登场之后，就这样站着——', vis: '超级碗：音乐切断，静止计时器开始走', mus: 'cut', media: 4, note: '说完后一动不动，停顿 3–4 秒', year: 1993 },
      { cont: true, ko: '2분 가까이. 아무것도 하지 않고, 함성만으로 무대를 채웠습니다.', zh: '将近两分钟。什么都不做，只用欢呼声填满了整个体育场。', vis: '（停顿 3~4 秒后）秒表快进到将近两分钟', mus: 'off', year: 1993 },
      { ko: '미국에서만 1억 3,340만 명이 봤습니다. 전반전보다 하프타임 시청률이 오히려 높았던 건 슈퍼볼 역사상 처음이었고, 이 무대 이후 하프타임 쇼는 최고의 스타만 설 수 있는 무대가 됩니다.', zh: '仅美国就有1.334亿人观看。中场秀收视率反超上半场，这在超级碗史上是第一次；从此，中场秀成为只有顶级巨星才能登上的舞台。', vis: '大号「133,400,000」', mus: 'off', year: 1993 },
    ] },
  { key: 'shadow', era: 'shadow', act: 2, budget: 85, year: 1993, hud: true, enter: 'dissolve', chapter: 'VI',
    title: L('그림자', '阴影'), short: L('VI 그림자', 'VI 阴影'), track: 'moscow',
    beats: [
      { ko: '그런데 바로 그해부터, 그를 비추는 빛의 성격이 바뀝니다.', zh: '然而就从那一年起，照在他身上的光，变了性质。', vis: '跟光熄灭，冷环境光；章节卡 VI 그림자 1993 — 2005', mus: 'low' },
      { ko: '1993년 2월, 그는 인터뷰에서 백반증을 앓고 있다고 밝힙니다. 피부색이 왜 변했는지를 두고 오랫동안 조롱과 추측이 쏟아졌습니다.', zh: '1993年2月，他在采访中公开自己患有白癜风。关于肤色为何改变，嘲讽和猜测持续了很多年。', vis: '闪光灯 +「1993. 2 — 백반증 공개」', mus: 'low' },
      { ko: '같은 해, 아동 성추행 의혹이 제기됩니다. 형사 기소는 없었고, 1994년 민사 합의로 끝났습니다. 2003년 다시 기소되었지만, 2005년 재판에서 배심원단은 모든 혐의에 무죄를 평결했습니다.', zh: '同年，儿童性侵指控出现。当时没有被提起刑事诉讼，1994年以民事和解告终。2003年他再次被起诉，而在2005年的审判中，陪审团裁定所有指控均不成立。', vis: '记录卡：1993 · 1994 · 2005（背景是模糊的小报）', mus: 'low', year: 2005 },
      { cont: true, ko: '그가 세상을 떠난 뒤인 2019년, 한 다큐멘터리로 논쟁은 다시 불붙었고, 유족 측은 이를 강하게 반박하고 있습니다. 저는 오늘 판단 대신, 확인된 사실까지만 말씀드리겠습니다.', zh: '他去世后的2019年，一部纪录片让争议再度升温，家属方面对此强烈反驳。今天我不下判断，只讲到已确认的事实为止。', vis: '续：第四张记录卡 2019', mus: 'low', year: 2019 },
      { ko: '이 시기에 그는 〈Earth Song〉과 〈Stranger in Moscow〉 같은 노래를 남깁니다. 가장 강한 빛 속에 서 있던 사람이, 가장 외로운 노래를 부르고 있었던 거죠.', zh: '这一时期，他留下了《Earth Song》《Stranger in Moscow》这样的歌。站在最强光芒里的人，却唱着最孤独的歌。', vis: '「그 시기의 노래」', mus: 'low', year: 1996 },
    ] },
  { key: 'seoul', era: 'seoul', act: 2, budget: 45, year: 1996, hud: true, enter: 'dissolve', chapter: '간주',
    title: L('서울', '首尔'), short: L('간주 서울', '间奏 首尔'), track: 'earth',
    beats: [
      { ko: '그리고 그는, 이곳 한국에도 왔습니다.', zh: '而他，也来过这里——韩国。', vis: '汉江线条地图，蚕室亮起「그리고, 서울」', mus: 'card' },
      { ko: '1996년 10월, 잠실 올림픽 주경기장. 그의 첫 내한 공연이었습니다. 무대 장비만 430톤, 〈Earth Song〉에서는 실물 크기의 탱크가 무대에 올라왔습니다.', zh: '1996年10月，蚕室奥林匹克主体育场，他的首次访韩演出。光舞台设备就有430吨，《Earth Song》时，一辆真实大小的坦克开上了舞台。', vis: '票根 1996. 10. 11 · 13' },
      { cut: true, ko: '1998년에는 김대중 대통령의 취임식에도 참석했습니다.', zh: '1998年，他还出席了金大中总统的就职典礼。', vis: '1998：汝矣岛国会标记', year: 1998 },
      { ko: '그리고 1999년 6월 25일, 그는 다시 잠실에서 자선 공연 무대에 섭니다. 이 날짜를, 잠시만 기억해 주세요.', zh: '1999年6月25日，他再次站上蚕室的慈善演唱会舞台。这个日期，请大家先记住。', vis: '票根 1999. 6. 25 发光', year: 1999 },
    ] },
  { key: 'tii', era: 'tii', act: 3, budget: 60, year: 2009, hud: true, enter: 'blackout', chapter: 'VII',
    title: L('디스 이즈 잇', '《This Is It》'), short: L('VII This Is It', 'VII This Is It'), track: 'human',
    beats: [
      { ko: '2009년 3월, 그는 런던에서 50회 공연을 발표합니다. 스스로 ‘마지막 커튼콜’이라고 부른 무대였습니다.', zh: '2009年3月，他宣布在伦敦举行50场演出，他自己称之为「最后的谢幕」。', vis: '「3막 · 빛 너머」→ 章节卡 VII 2009，50 场方格全亮', mus: 'card', media: 2 },
      { ko: '그리고 리허설이 한창이던 6월 25일, 그는 쉰 살의 나이로 세상을 떠납니다. 50번의 공연은 단 한 번도 열리지 못했습니다.', zh: '就在排练最紧张的6月25日，他以五十岁的年纪离开了人世。那50场演出，一场也没能举行。', vis: '音乐 0.6 秒切断，50 个方格熄灭，「2009. 6. 25」', mus: 'cut6', media: 4, note: '「2009. 6. 25」出现后留 4 秒全静' },
      { ko: '6월 25일. 기억하시나요? 서울 잠실 공연이 1999년 6월 25일이었습니다. 정확히 10년 뒤였습니다.', zh: '6月25日。还记得吗？首尔蚕室的那场演出，是1999年6月25日——整整十年之后。', vis: '十年红线：1999 票根飞来，「10년 · 3,653일」', mus: 'off' },
      { ko: '그해 10월, 리허설 영상은 영화 〈This Is It〉으로 공개됩니다. 우리가 볼 수 있는 그의 마지막 무대는, 결국 ‘연습’이었습니다.', zh: '同年10月，排练影像以电影《This Is It》的形式公开。我们能看到的他最后的舞台，终究是一场「排练」。', vis: '工作灯下：「This Is It · 2009. 10」', mus: 'off' },
    ] },
  { key: 'legacy', era: 'legacy', act: 3, budget: 60, year: 2026, hud: true, enter: 'houselights', chapter: 'VIII',
    title: L('유산', '遗产'), short: L('VIII 유산', 'VIII 遗产'), track: 'rtt',
    beats: [

    b.scene = si; b.local = bi; b.index = BEATS.length;
    b.syl = b.silent ? 0 : syllables(b.ko);

});
/* human labels like the blueprint (③续, ②b) */

const HARD_LIMIT = 900;

/* planned timeline: inside each scene, split the budget by estimated beat length */
function computePlan(rate) {
  let t = 0;
  SCENES.forEach(sc => {
    const raw = sc.beats.map(b => (b.syl / rate) + (b.media || 0) + .5);
    const sum = raw.reduce((a, b) => a + b, 0);
    sc.planStart = t;
    sc.beats.forEach((b, i) => { b.planDur = sc.budget * raw[i] / sum; b.planStart = t; b.estDur = raw[i]; t += b.planDur; });
  });
  return t;
}

/* ── 03-settings ── */
/* ═══ settings · session · rehearsal runs (all local to this browser) ═══ */
function deepMerge(base, over) {
  if (Array.isArray(base)) {
    const out = base.map((v, i) => (over && over[i] !== undefined) ? deepMerge(v, over[i]) : clone(v));
    if (Array.isArray(over) && over.length > base.length) for (let i = base.length; i < over.length; i++) out.push(clone(over[i]));
    return out;
  }
  if (base && typeof base === 'object') {
    const out = {};
    for (const k of new Set([...Object.keys(base), ...Object.keys(over || {})])) {
      out[k] = (over && over[k] !== undefined) ? (base[k] !== undefined ? deepMerge(base[k], over[k]) : clone(over[k])) : clone(base[k]);
    }
    return out;
  }
  return over !== undefined ? over : base;
}
const clone = v => v == null ? v : JSON.parse(JSON.stringify(v));

const Settings = (() => {

  const emit = () => subs.forEach(f => { try { f(s); } catch (e) { console.error(e); } });
  return {
    get: () => s,

      o[keys[0]] = value;

    },
    replace(obj) { s = deepMerge(DEFAULTS, obj || {}); store.set('settings', s); Bus.send({ type: 'settings' }); emit(); },
    reset() { s = clone(DEFAULTS); store.set('settings', s); Bus.send({ type: 'settings' }); emit(); },
    reload() { s = deepMerge(DEFAULTS, store.get('settings', {})); emit(); },
    on(f) { subs.add(f); return () => subs.delete(f); },

})();

/* session: where we are + the show clock. Survives an accidental refresh. */
const Session = {

  save() { store.set('session', { beat: this.beat, timer: this.timer, saved: Date.now() }); },
  running() { return this.timer.start != null && this.timer.pausedAt == null; },
  elapsed(at = Date.now()) {
    const t = this.timer; if (t.start == null) return 0;
    return Math.max(0, ((t.pausedAt ?? at) - t.start - t.pausedTotal) / 1000);
  },
  startClock() { if (this.timer.start == null) { this.timer = { start: Date.now(), pausedAt: null, pausedTotal: 0 }; this.save(); } },
  pause() { if (this.running()) { this.timer.pausedAt = Date.now(); this.save(); } },
  resume() { const t = this.timer; if (t.pausedAt != null) { t.pausedTotal += Date.now() - t.pausedAt; t.pausedAt = null; this.save(); } },
  resetClock() { this.timer = { start: null, pausedAt: null, pausedTotal: 0 }; this.save(); },

/* rehearsal runs: each run stores when every beat was entered */
const Runs = {
  list: [],
  curId: null,
  load() { this.list = store.get('runs', []); this.curId = store.get('runCur', null); },
  save() { store.set('runs', this.list.slice(-12)); store.set('runCur', this.curId); },
  cur() { return this.list.find(r => r.id === this.curId) || null; },
  begin() {
    const r = { id: 'r' + Date.now().toString(36), started: Date.now(), marks: [], done: false };
    this.list.push(r); this.curId = r.id; this.save(); return r;
  },
  mark(beat, t) { const r = this.cur(); if (!r || r.done) return; r.marks.push([beat, Math.round(t * 10) / 10]); this.save(); },
  finish(t) { const r = this.cur(); if (!r) return; r.done = true; r.total = Math.round(t * 10) / 10; this.save(); },
  /* per-scene actual seconds for a run */
  sceneTimes(r) {
    const out = SCENES.map(() => null);
    if (!r || !r.marks.length) return out;
    const enter = SCENES.map(() => null);
    r.marks.forEach(([b, t]) => { const s = BEATS[b] && BEATS[b].scene; if (s != null && enter[s] == null) enter[s] = t; });
    SCENES.forEach((sc, i) => {
      if (enter[i] == null) return;
      let exit = null;
      for (const [b, t] of r.marks) { const s = BEATS[b] && BEATS[b].scene; if (s > i && t >= enter[i]) { exit = t; break; } }
      if (exit == null && r.done && r.total != null && i === SCENES.length - 1) exit = r.total;
      if (exit != null) out[i] = Math.max(0, exit - enter[i]);

  },
  /* speech rate measured from a run: spoken syllables ÷ (time − media − beat overhead) */
  rate(r) {
    if (!r || r.marks.length < 4) return null;
    let syl = 0, secs = 0;
    for (let i = 0; i < r.marks.length - 1; i++) {
      const [b, t] = r.marks[i], [b2, t2] = r.marks[i + 1];
      if (b2 !== b + 1 && !(BEATS[b + 1] && (BEATS[b + 1].optional || BEATS[b + 1].cut) && b2 > b)) continue;

      const d = t2 - t - (beat.media || 0) - .5;
      if (d > 1 && d < 90) { syl += beat.syl; secs += d; }
    }
    return secs > 20 ? syl / secs : null;
  },
};

/* ── 03b-quality ── */
/* ═══ QUALITY — what this device can afford ═══

    else if (LITE) { tier = 'low'; why = '自动 · 手机 / 平板'; }
    else if (saved && TIERS.includes(saved.tier)) { tier = saved.tier; why = `自动 · 这台电脑上次检测到约 ${saved.fps} fps`; }
    else { tier = WEBKIT ? 'standard' : 'high'; why = WEBKIT ? '自动 · Safari' : '自动'; }

    get tier() { return tier; }, get why() { return why; }, get p() { return P[tier]; }, get name() { return NAME[tier]; },
    TIERS, NAME, pick, on(f) { subs.add(f); return () => subs.delete(f); },

  function rrect(c, x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }
  function cutRect(c, l) {
    const i = Math.min(1, lvl(l)); if (i <= .002) return;
    const N = 8, a = 1 - Math.pow(1 - Math.min(i, .999), 1 / N), soft = Math.max(1, l.soft);
    c.fillStyle = 'rgba(0,0,0,1)';
    for (let n = 0; n < N; n++) {
      const inset = soft * (n / (N - 1)) - soft / 2;
      c.globalAlpha = a;
      rrect(c, l.x - l.w / 2 + inset, l.y - l.h / 2 + inset, l.w - inset * 2, l.h - inset * 2, l.r + Math.max(0, -inset));
      c.fill();
    }
    c.globalAlpha = 1;
  }

  /* glow: cone in haze + inner warmth + halo ring */
  function glowSpot(c, l, col) {
    const i = lvl(l); if (i <= .002) return;
    const rx = Math.max(1, l.rx), ry = Math.max(1, l.ry);
    const lc = l.col ? hexRgb(l.col) : col;
    if (S.haze > .001 && l.cone) {
      /* the beam through the haze: a soft-edged sprite from the lamp to the pool of light */
      const sx = l.sx ?? (W / 2 + (l.x - W / 2) * .38), sy = l.sy ?? -180;
      const dx = l.x - sx, dy = l.y - sy, dist = Math.hypot(dx, dy) || 1;
      const len = dist + ry * .55, halfW = Math.max(rx, ry) * .98;
      c.save(); c.translate(sx, sy); c.rotate(Math.atan2(dy, dx));
      c.scale(len / 512, Math.max(.01, halfW * 2 / 252));
      c.globalAlpha = clamp(S.haze * i * .24, 0, 1);
      c.drawImage(beamTinted(col), 0, -128); c.restore();
    }
    c.save(); c.translate(l.x, l.y); c.scale(1, ry / rx);
    const g2 = c.createRadialGradient(0, 0, 0, 0, 0, rx * 1.28);
    const edge = 1 / 1.28, inner = Math.min(edge - .006, (1 - clamp(l.soft, .004, 1)) * edge);
    g2.addColorStop(0, rgba(col, .075 * i));
    g2.addColorStop(inner, rgba(col, .05 * i));
    if (l.halo) { g2.addColorStop(edge, rgba(lc, (.075 + (l.rim || 0) * .4) * i)); g2.addColorStop(Math.min(.99, edge + .08), rgba(lc, (.02 + (l.rim || 0) * .1) * i)); }
    g2.addColorStop(1, rgba(lc, 0));
    c.fillStyle = g2; c.beginPath(); c.arc(0, 0, rx * 1.28, 0, TAU); c.fill(); c.restore();
  }
  function glowBeam(c, l, col) {
    const i = lvl(l); if (i <= .002) return;
    const lc = l.col ? hexRgb(l.col) : col;
    c.save(); c.translate(l.x, l.y); c.rotate(l.ang * Math.PI / 180);
    const hw = Math.tan(clamp(l.spread, .5, 80) * Math.PI / 180) * l.len;
    c.scale(l.len / 512, Math.max(.01, hw * 2 / 252));
    c.globalAlpha = clamp(i * (.1 + S.haze * .28), 0, 1); c.drawImage(beamTinted(lc), 0, -128); c.restore();
  }
  function glowRect(c, l, col) {
    const i = lvl(l); if (i <= .002) return;
    c.save(); c.globalAlpha = .05 * i; c.fillStyle = rgba(l.col ? hexRgb(l.col) : col, 1);
    rrect(c, l.x - l.w / 2, l.y - l.h / 2, l.w, l.h, l.r); c.fill(); c.restore();
  }

  /* the vignette, drawn into the darkness (one full-screen layer fewer) */
  function vignette(c) {
    c.save(); c.translate(W / 2, H * .48); c.scale(1, (H * .7) / (W * .72));
    const r = W * .72, g = c.createRadialGradient(0, 0, 0, 0, 0, r);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.58, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.55)');
    c.fillStyle = g; c.fillRect(-W, -r * 2, W * 2, r * 4); c.restore();
  }

  /* dust motes living in the beams */
  const dust = Array.from({ length: 220 }, (_, n) => {
    const r = Math.random;
    return { x: r() * W, y: r() * H, z: r(), vx: (r() - .5) * 8, vy: (r() - .5) * 6 - 2, ph: r() * TAU, sp: .4 + r() * 1.6 };
  });
  function litFactor(px, py) {
    let f = 0;
    for (const l of S.lights.values()) {
      const i = lvl(l); if (i <= .01) continue;
      if (l.type === 'spot') {
        const dx = (px - l.x) / l.rx, dy = (py - l.y) / l.ry, d = dx * dx + dy * dy;
        if (d < 1.1) f = Math.max(f, i * clamp((1.1 - d) * 2.2, 0, 1));
        if (S.haze > .01 && l.cone) {
          const sx = l.sx ?? (W / 2 + (l.x - W / 2) * .38), sy = l.sy ?? -180;
          const ax = l.x - sx, ay = l.y - sy, al = ax * ax + ay * ay;
          const t = ((px - sx) * ax + (py - sy) * ay) / al;
          if (t > 0 && t < 1) {
            const cx = sx + ax * t, cy = sy + ay * t, wd = lerp(16, Math.max(l.rx, l.ry), t);
            const off = Math.hypot(px - cx, py - cy);
            if (off < wd) f = Math.max(f, i * S.haze * .9 * t * clamp((wd - off) / (wd * .35), 0, 1));
          }
        }
      } else if (l.type === 'beam') {
        const a = l.ang * Math.PI / 180, ux = Math.cos(a), uy = Math.sin(a);
        const qx = px - l.x, qy = py - l.y, along = qx * ux + qy * uy;
        if (along > 0 && along < l.len) {
          const across = Math.abs(-qx * uy + qy * ux), wd = Math.tan(l.spread * Math.PI / 180) * along;
          if (across < wd) f = Math.max(f, i * .8 * clamp((wd - across) / (wd * .4 + 1), 0, 1) * (1 - along / l.len * .6));
        }
      } else if (l.type === 'rect') {
        if (Math.abs(px - l.x) < l.w / 2 && Math.abs(py - l.y) < l.h / 2) f = Math.max(f, i * .5);
      }
    }
    return f;
  }

  function frame(t, dt) {
    let animating = false;
    const tn = now();
    for (let n = tweens.length - 1; n >= 0; n--) {
      const tw = tweens[n]; if (tn < tw.t0) { animating = true; continue; }
      const p = clamp((tn - tw.t0) / tw.dur, 0, 1);
      tw.o[tw.k] = lerp(tw.a, tw.b, tw.ez(p));
      if (p >= 1) tweens.splice(n, 1); else animating = true;
    }
    for (const [id, l] of S.lights) if (l.dead && l.i <= .001 && !tweens.some(tw => tw.o === l)) S.lights.delete(id);
    const live = animating || dirty;
    const col = tint(S.warm);
    const time = (tn - t0) / 1000;

    /* darkness: only when a light moved, or a mask layer (torch, disco ball) is running */
    if (live || maskLayers.size) {
      stats.mask++;
      mc.setTransform(k, 0, 0, k, 0, 0);
      mc.globalCompositeOperation = 'source-over'; mc.globalAlpha = 1;
      mc.clearRect(0, 0, W, H);
      const amb = clamp(S.ambient * (1 - S.wash), 0, 1);
      if (amb > .001) {
        mc.fillStyle = `rgba(0,0,0,${amb})`; mc.fillRect(0, 0, W, H);
        mc.globalCompositeOperation = 'destination-out';
        for (const l of S.lights.values()) { if (l.type === 'spot') cutSpot(mc, l); else if (l.type === 'beam') cutBeam(mc, l); else cutRect(mc, l); }
        for (const f of maskLayers) f(mc, time, dt, S);
        mc.globalCompositeOperation = 'source-over';
      }
      vignette(mc);
    }

    /* glow: the same rule */
    if (live || glowLayers.size) {
      stats.glow++;
      gc.setTransform(k, 0, 0, k, 0, 0);
      gc.globalCompositeOperation = 'source-over'; gc.globalAlpha = 1;
      gc.clearRect(0, 0, W, H);
      for (const l of S.lights.values()) { if (l.type === 'spot') glowSpot(gc, l, col); else if (l.type === 'beam') glowBeam(gc, l, col); else glowRect(gc, l, col); }
      if (S.wash > .001) { gc.fillStyle = rgba(AMBER, .16 * S.wash); gc.fillRect(0, 0, W, H); }
      if (S.bloom > .001) {
        const g = gc.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * .75);
        g.addColorStop(0, rgba([255, 244, 226], .9 * S.bloom)); g.addColorStop(.55, rgba([255, 226, 186], .55 * S.bloom)); g.addColorStop(1, rgba([255, 206, 150], .3 * S.bloom));
        gc.fillStyle = g; gc.fillRect(0, 0, W, H);
      }
      for (const f of glowLayers) f(gc, time, dt, S);
    }

    /* particles: their own small canvas, at a capped frame rate, and only while there are any */
    const P = Q.p, wantFx = P.fx > 0 && !reduced && (S.dust > .01 || [...fxLayers].some(l => l.active()));
    if (wantFx) {
      if (tn - lastFx >= 1000 / P.fxFps - 4) {
        const fdt = Math.min(.15, lastFx ? (tn - lastFx) / 1000 : dt); lastFx = tn; stats.fx++;
        fc.setTransform(fk, 0, 0, fk, 0, 0); fc.globalCompositeOperation = 'source-over'; fc.globalAlpha = 1;
        fc.clearRect(0, 0, W, H);
        if (S.dust > .01) {
          fc.globalCompositeOperation = 'lighter';
          const n = Math.ceil(dust.length * P.fx);
          for (let q = 0; q < n; q++) {
            const p = dust[q];
            if (!still) {
              p.x += (p.vx + Math.sin(time * .3 + p.ph) * 4) * fdt * p.sp; p.y += (p.vy + Math.cos(time * .23 + p.ph) * 3) * fdt * p.sp;
              if (p.x < -10) p.x = W + 10; if (p.x > W + 10) p.x = -10; if (p.y < -10) p.y = H + 10; if (p.y > H + 10) p.y = -10;
            }
            const f = litFactor(p.x, p.y); if (f <= .02) continue;
            const tw = .55 + .45 * Math.sin(time * p.sp * 2.1 + p.ph);
            const a = clamp(S.dust * f * tw * (.35 + p.z * .65), 0, 1);
            const r = .9 + p.z * 2.1;
            fc.fillStyle = rgba(col, a); fc.beginPath(); fc.arc(p.x, p.y, r, 0, TAU); fc.fill();
          }
          fc.globalCompositeOperation = 'source-over';
        }
        for (const l of fxLayers) if (l.active()) l.draw(fc, time, fdt, P.fx);
        fxShown = true;
      }
    } else if (fxShown) { fc.setTransform(1, 0, 0, 1, 0, 0); fc.clearRect(0, 0, fxc.width, fxc.height); fxShown = false; lastFx = 0; }
    dirty = false;
  }
  Loop.add(frame);

  return {
    set, flicker, setScale, S, stats, why: () => ({ tweens: tweens.length, dirty, maskLayers: maskLayers.size, glowLayers: glowLayers.size, fxLayers: [...fxLayers].filter(l => l.active()).length, dust: S.dust }),
    get: id => S.lights.get(id),
    glowLayer(f) { glowLayers.add(f); Loop.kick(); return () => { glowLayers.delete(f); dirty = true; }; },
    /* particles: draw(ctx, time, dt, share) where share (0–1) is the part of the particles this device draws */
    fxLayer(draw, active) { const l = { draw, active }; fxLayers.add(l); Loop.kick(); return () => fxLayers.delete(l); },
    maskLayer(f) { maskLayers.add(f); Loop.kick(); return () => { maskLayers.delete(f); dirty = true; }; },
    touch() { dirty = true; Loop.kick(); },
    setReduced(v) { reduced = !!v; },
    setStill(v) { still = !!v; },
    tint, rgba, hexRgb,
  };
})();

               grade: { background: 'linear-gradient(180deg, rgba(255, 200, 100, .1), rgba(90, 10, 20, .22))', mixBlendMode: 'soft-light', opacity: 1 } },

  seoul:     { bg: 'radial-gradient(ellipse 80% 70% at 62% 30%, #15295a 0%, #0a1634 52%, #040a1a 100%)', grain: .07, light: { ambient: .55, warm: .55, haze: .12, dust: .15 }, fx: { bokeh: 1 } },
  tii:       { bg: 'radial-gradient(ellipse 70% 70% at 72% 18%, #3d3d42 0%, #232326 52%, #141416 100%)', grain: .1, light: { ambient: .82, warm: .15, haze: .55, dust: 1 } },

/* ═══ FX — particles that belong to a decade (drawn into the particle canvas, at the share this device can afford) ═══ */
const FX = (() => {
  const lv = { motes: 0, disco: 0, gold: 0, bokeh: 0, rise: 0, rain: 0, crowd: 0 };
  const stops = {};
  let reduced = false, discoOff = null;
  const R = rng(83);
  const P = (n, f) => Array.from({ length: n }, (_, i) => f(i));
  const motes = P(70, () => ({ x: R() * W, y: R() * H, r: .6 + R() * 1.8, vx: (R() - .5) * 10, vy: -4 - R() * 8, ph: R() * TAU }));
  const gold = P(120, () => ({ x: R() * W, y: R() * H, r: .6 + R() * 2.2, vy: -6 - R() * 16, sw: 10 + R() * 30, ph: R() * TAU, tw: 1 + R() * 3 }));
  const bokeh = P(30, () => ({ x: R() * W, y: R() * H * .8, r: 26 + R() * 90, c: R() < .55 ? [127, 176, 255] : (R() < .7 ? [255, 236, 200] : [255, 190, 110]), a: .05 + R() * .08, vx: (R() - .5) * 6, vy: (R() - .5) * 4, ph: R() * TAU }));
  const rise = P(110, () => ({ x: R() * W, y: H + R() * H, r: .8 + R() * 2.6, vy: 18 + R() * 46, sw: 8 + R() * 24, ph: R() * TAU }));
  const rain = P(160, () => ({ x: R() * (W + 300), y: R() * H, l: 28 + R() * 60, v: 820 + R() * 420, a: .05 + R() * .08 }));
  const crowd = P(360, () => ({ x: R() * W, y: 880 + Math.pow(R(), .7) * 210, r: .6 + R() * 1.6, ph: R() * TAU, f: 0, warm: R() < .5 }));
  const disco = P(72, () => ({ lon: R() * TAU, lat: (R() - .5) * 1.7, s: .5 + R() * .7 }));

  function set(cfg = {}, dur = 1.8) {
    for (const k of Object.keys(lv)) {
      const target = cfg[k] || 0; if (stops[k]) stops[k]();
      const a = lv[k];
      if (a === target) continue;
      stops[k] = tween(dur * 1000, (e) => { lv[k] = lerp(a, target, e); }, ease.inOutSine);
    }
    if ((cfg.disco || 0) > 0 && !discoOff && Q.p.disco) discoOff = Light.maskLayer(discoMask);
    if (!(cfg.disco > 0) && discoOff) setTimeout(() => { if (lv.disco <= .001 && discoOff) { discoOff(); discoOff = null; } }, dur * 1000 + 50);
  }

  function discoPos(d, t) {
    const a = d.lon + t * .11, c = Math.cos(a);
    if (c < .08) return null;
    return { x: W / 2 + Math.sin(a) * W * .64, y: H * .46 + Math.sin(d.lat) * H * .62 + Math.cos(a) * 18, rx: (8 + 16 * d.s) * (.45 + c * .7), f: Math.min(1, (c - .08) * 3) };
  }
  function discoMask(c, t) {
    if (lv.disco <= .001) return;
    for (const d of disco) {
      const p = discoPos(d, reduced ? 0 : t); if (!p) continue;
      const i = lv.disco * .5 * p.f;
      const g = c.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.rx);
      g.addColorStop(0, `rgba(0,0,0,${i})`); g.addColorStop(.55, `rgba(0,0,0,${i * .8})`); g.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = g; c.beginPath(); c.ellipse(p.x, p.y, p.rx, p.rx * .78, 0, 0, TAU); c.fill();
    }
  }

  const take = (a, share) => (share >= 1 ? a : a.slice(0, Math.ceil(a.length * share)));
  Light.fxLayer((c, t, dt, share) => {
    const live = !reduced;
    c.globalCompositeOperation = 'lighter';
    if (lv.motes > .01) for (const p of take(motes, share)) {
      if (live) { p.x += (p.vx + Math.sin(t * .4 + p.ph) * 5) * dt; p.y += p.vy * dt; if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; } if (p.x < -10) p.x = W + 10; if (p.x > W + 10) p.x = -10; }
      c.fillStyle = `rgba(255,214,150,${.16 * lv.motes * (.6 + .4 * Math.sin(t * 1.3 + p.ph))})`;
      c.beginPath(); c.arc(p.x, p.y, p.r, 0, TAU); c.fill();
    }
    if (lv.disco > .01) for (const d of take(disco, share)) {
      const p = discoPos(d, live ? t : 0); if (!p) continue;
      const g = c.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.rx * 1.6);
      g.addColorStop(0, `rgba(255,236,196,${.32 * lv.disco * p.f})`); g.addColorStop(1, 'rgba(255,236,196,0)');
      c.fillStyle = g; c.beginPath(); c.arc(p.x, p.y, p.rx * 1.6, 0, TAU); c.fill();
    }
    if (lv.gold > .01) for (const p of take(gold, share)) {
      if (live) { p.y += p.vy * dt; if (p.y < -12) { p.y = H + 12; p.x = Math.random() * W; } }
      const x = p.x + Math.sin(t * .5 + p.ph) * p.sw;
      const a = lv.gold * (.18 + .5 * Math.pow(Math.max(0, Math.sin(t * p.tw + p.ph)), 6));
      c.fillStyle = `rgba(236,196,104,${a})`; c.beginPath(); c.arc(x, p.y, p.r, 0, TAU); c.fill();
    }
    if (lv.bokeh > .01) for (const b of take(bokeh, share)) {
      if (live) { b.x += b.vx * dt; b.y += b.vy * dt; if (b.x < -120) b.x = W + 120; if (b.x > W + 120) b.x = -120; if (b.y < -120) b.y = H * .8; if (b.y > H * .85) b.y = -100; }
      const a = b.a * lv.bokeh * (.75 + .25 * Math.sin(t * .6 + b.ph));
      const g = c.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
      g.addColorStop(0, Light.rgba(b.c, a * .55)); g.addColorStop(.82, Light.rgba(b.c, a * .75)); g.addColorStop(.92, Light.rgba(b.c, a)); g.addColorStop(1, Light.rgba(b.c, 0));
      c.fillStyle = g; c.beginPath(); c.arc(b.x, b.y, b.r, 0, TAU); c.fill();
    }
    if (lv.rise > .01) for (const p of take(rise, share)) {
      if (live) { p.y -= p.vy * dt; if (p.y < -20) { p.y = H + 20 + Math.random() * 200; p.x = Math.random() * W; } }
      const x = p.x + Math.sin(t * .7 + p.ph) * p.sw, f = clamp(p.y / H, 0, 1);
      const a = lv.rise * .55 * f * (.6 + .4 * Math.sin(t * 2 + p.ph));

/* ── 06-audio ── */
/* ═══ SOUND — era music decks (local file or YouTube), three volume levels, ducking, synthesized SFX ═══ */
const ytId = (src) => {
  if (!src) return null;
  const s = String(src).trim();
  if (/^[\w-]{11}$/.test(s)) return s;
  const m = s.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/);
  return m ? m[1] : null;
};
const isFileSrc = (src) => !!src && !ytId(src) && /\.(mp3|m4a|aac|ogg|oga|wav|flac|mp4|webm|mov|m4v)(\?.*)?$/i.test(String(src).trim());

/* Local media is pulled into memory once. Blob URLs are always seekable (python's http.server has no
   Range support, so start points and cue points would otherwise be ignored) and nothing buffers mid-talk. */
const MediaCache = (() => {
  const urls = new Map(), pending = new Map();
  function url(src) {
    if (!src || /^(blob:|data:)/.test(src) || location.protocol === 'file:') return Promise.resolve(src);
    if (urls.has(src)) return Promise.resolve(urls.get(src));
    if (pending.has(src)) return pending.get(src);
    const p = fetch(src).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
      .then(b => { const u = URL.createObjectURL(b); urls.set(src, u); pending.delete(src); return u; })
      .catch(err => { pending.delete(src); throw err; });
    pending.set(src, p);
    return p;
  }
  /* warm every configured local file in the background, one at a time */
  async function warmAll() {
    const s = Settings.get();
    const list = [...Object.values(s.tracks).map(t => (t.src || '').trim()), ...Object.values(s.videos).map(v => (v.src || '').trim())].filter(isFileSrc);
    for (const src of list) { try { await url(src); } catch (e) { /* reported by the pre-flight */ } }
  }
  return { url, warmAll, ready: (src) => urls.has(src) };
})();

const Music = (() => {
  const decks = {};            /* key → deck */
  let active = null, mode = 'off', muted = false, ducked = false;
  let decayTimer = 0, fadeTimer = 0, unduckTimer = 0;
  const listeners = new Set();
  const emit = () => listeners.forEach(f => f(status()));

  function levelOf(m) {
    const v = Settings.get().vol;
    switch (m) {
      case 'card': return v.card / 100;
      case 'speech': return v.speech / 100;
      case 'low': return v.low / 100;
      case 'max': return v.max / 100;
      case 'video': return v.video / 100;
      case 'rise': return v.card / 100;
      case 'fadeout': return v.max / 100;
      default: return 0;
    }
  }
  const master = () => muted ? 0 : Settings.get().vol.master / 100;

  function makeDeck(key) {
    const cfg = Settings.get().tracks[key] || {};
    const src = (cfg.src || '').trim();
    const d = { key, src, start: +cfg.start || 0, gain: 0, state: 'idle', error: null, stop: null, kind: null };
    const yid = ytId(src);
    if (yid) {
      d.kind = 'yt';
      d.slot = Video.bgSlot(key);
      d.setVol = (g) => d.slot.setVolume(Math.round(g * 100));
      d.play = () => { d.state = 'loading'; return d.slot.load({ id: yid, start: d.start, muted: false, loop: true, autoplay: true }).then(ok => { d.state = ok ? 'playing' : 'error'; if (!ok) d.error = d.slot.error || 'YouTube'; emit(); return ok; }); };
      d.pause = () => d.slot.pause();
      d.show = (v) => d.slot.showBg(v);
    } else if (src) {
      d.kind = 'file';
      const a = new Audio(); a.preload = 'auto'; a.loop = true; a.volume = 0;
      a.addEventListener('error', () => { if (!a.getAttribute('src')) return; d.state = 'error'; d.error = '文件无法加载'; emit(); });
      a.addEventListener('playing', () => { d.state = 'playing'; emit(); NowPlaying.show(key); });
      d.el = a;
      d.setVol = (g) => { a.volume = clamp(g, 0, 1); };
      d.play = () => {
        d.state = 'loading'; emit();
        return MediaCache.url(src).then(u => new Promise((res) => {
          if (a.getAttribute('src') !== u) a.src = u;
          const seekThenPlay = () => {
            try { a.currentTime = d.start; } catch (e) { /* ignore */ }
            const p = a.play();
            (p && p.then ? p : Promise.resolve()).then(() => res(true)).catch(err => {
              if (err && err.name === 'NotAllowedError') { d.state = 'blocked'; Music.pendingGesture = true; }
              else { d.state = 'error'; d.error = d.error || String(err && err.message || err); }

            });

        })).catch(err => { d.state = 'error'; d.error = '文件无法加载：' + src + '（' + (err && err.message || err) + '）'; emit(); return false; });
      };
      d.pause = () => { try { a.pause(); } catch (e) { /* ignore */ } };
      d.show = () => {};
    } else {
      d.kind = 'none'; d.state = 'unset';
      d.setVol = () => {}; d.play = () => Promise.resolve(false); d.pause = () => {}; d.show = () => {};
    }
    return d;
  }
  function deck(key) {
    const cfg = Settings.get().tracks[key] || {};
    let d = decks[key];
    if (d && (d.src !== (cfg.src || '').trim())) { try { d.pause(); } catch (e) { /* ignore */ } d = null; }
    if (!d) d = decks[key] = makeDeck(key);

  }
  function ramp(d, to, dur, onDone) {
    if (d.stop) d.stop();
    const from = d.gain;
    if (!(dur > 0)) { d.gain = to; d.setVol(to * master()); onDone && onDone(); return; }
    d.stop = tween(dur * 1000, (e) => { d.gain = lerp(from, to, e); d.setVol(d.gain * master()); }, ease.inOutSine, () => { d.stop = null; onDone && onDone(); });
  }
  function stopDeck(d, dur) { ramp(d, 0, dur, () => { if (active !== d.key) { d.pause(); d.show(false); d.state = d.state === 'error' ? 'error' : 'idle'; emit(); } }); }

  /* called by the director for every beat */
  function apply(track, m, { dir = 1, instant = false } = {}) {
    clearTimeout(decayTimer); clearTimeout(fadeTimer); clearTimeout(unduckTimer); ducked = false;
    mode = m || 'speech';
    if (dir < 0 && (mode === 'card' || mode === 'rise')) mode = 'speech';
    if (dir < 0 && mode === 'fadeout') mode = 'max';
    const target = track ? levelOf(mode) : 0;
    if (active && active !== track) { const old = decks[active]; if (old) stopDeck(old, instant ? .3 : (mode === 'cut' ? .15 : 2)); }
    if (!track) { active = null; emit(); return; }

    active = track;
    const settle = (afterMs) => { clearTimeout(decayTimer); decayTimer = setTimeout(() => { if (active === track && (mode === 'card' || mode === 'rise')) { mode = 'speech'; ramp(d, levelOf('speech'), 1.6); emit(); } }, afterMs); };

      const rampIn = mode === 'rise' ? 3 : (instant ? .4 : (mode === 'card' ? 1.2 : 2));
      d.play().then(ok => {
        if (!(ok && active === track)) return;
        ramp(d, target, rampIn); NowPlaying.show(track);
        if (mode === 'card' || mode === 'rise') settle(rampIn * 1000 + 2000);
      });
    } else {
      const dur = { cut: .15, cut6: .6, off: 1, video: .9, card: .8, max: 2.2, rise: 3, fadeout: 1.2, low: 1.5 }[mode] || 1.2;
      ramp(d, target, instant ? .3 : dur);
      if (mode === 'cut' || mode === 'cut6') setTimeout(() => { if (active === track && (mode === 'cut' || mode === 'cut6')) { d.pause(); d.state = 'idle'; emit(); } }, (dur + .1) * 1000);
    }
    if (!isNew && (mode === 'card' || mode === 'rise')) settle(mode === 'rise' ? 5000 : 2800);

    emit();
